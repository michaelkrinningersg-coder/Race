name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Auf Ansage laufen beide Systeme, sonst nur Linux (Entscheidung des
    # Auftraggebers). Windows kostet je Push einen eigenen Runner und
    # bringt bei einer Zwischenstufe nichts dazu; vor einer Auslieferung
    # startet man den Lauf von Hand ueber "Run workflow".
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Qt-Systembibliotheken (nur Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[entwicklung]"

      - name: Ruff
        run: ruff check .

      # Verteilt sich ueber alle Kerne des Runners; die Einstellung
      # dafuer steht in pyproject.toml (addopts: -n auto).
      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
