# Rennmanager – Hersteller (GDD 12)
#
# 25 reale Autohersteller, nur Name und Farbe, kein Leistungsbonus.
# Diese Datei ist bewusst ausgelagert, damit die Namen bei einer
# Veroeffentlichung austauschbar sind (Markenrecht).
#
# Das GDD nennt die Zahl 20; seit Punkt 101 faehrt jeder Hersteller ein
# Team zu zwei Autos, deshalb sind es 25. Weder die konkreten Hersteller
# noch deren Farben stehen dort. Diese Liste ist am 2026-09-17 bestaetigt
# (OFFENE_PUNKTE.md, Punkt O1). Vor einer Veroeffentlichung laesst sie
# sich hier austauschen, ohne den Code anzufassen.

schema_version = 1
bestaetigt = true

