# Rennmanager – Hersteller (GDD 12)
#
# 20 reale Autohersteller, nur Name und Farbe, kein Leistungsbonus.
# Diese Datei ist bewusst ausgelagert, damit die Namen bei einer
# Veroeffentlichung austauschbar sind (Markenrecht).
#
# Das GDD nennt die Zahl 20, aber weder die konkreten Hersteller noch
# deren Farben. Diese Liste ist am 2026-09-17 bestaetigt worden
# (OFFENE_PUNKTE.md, Punkt O1). Vor einer Veroeffentlichung laesst sie
# sich hier austauschen, ohne den Code anzufassen.

