# Rennmanager – zentrale Balancing-Konfiguration
#
# Quelle aller Werte: "Rennmanager – Game Design Dokument (v1.0)".
# Jede Sektion nennt den zugehoerigen GDD-Abschnitt.
#
# Arbeitsregel: Balancing-Werte stehen ausschliesslich hier, nie im Code.
# Fehlt im GDD eine Angabe, steht sie unter [offen] und wird nicht erfunden.

schema_version = 1
gdd_version = "1.0"

# ---------------------------------------------------------------------------
# GDD 1 / 9 – Werteskala und Kalibrierung
# ---------------------------------------------------------------------------
[skala]
minimum = 0
maximum = 100_000
# Referenzwert, an dem die Kalibrierfunktion 180 km/h liefert
referenz = 98_000

[kalibrierung]
# v(S) = basis_kmh + spanne_kmh * sqrt(S / referenz)
basis_kmh = 55.0
spanne_kmh = 125.0
# Kontrollpunkte aus GDD 9
v_bei_0_kmh = 55.0
v_bei_referenz_kmh = 180.0
v_bei_maximum_kmh = 181.3
# Hoechstgeschwindigkeit auf Geraden, getrennt skaliert (GDD 4 und 9)
endgeschwindigkeit_max_kmh = 400.0
# GDD 9 kalibriert "auf einer kurvigen Referenzstrecke", ohne sie zu nennen.
# Entschieden am 2026-09-17 (OFFENE_PUNKTE.md, Punkt O2): Zandvoort - mit
# 46 % der geringste Geradenanteil aller 20 Strecken, laut GDD 3
# "Steilkurven, eng". Ein Wechsel erfordert einen Lauf von
# werkzeuge/kalibriere.py --schreiben.
referenzstrecke = "Zandvoort"

# ---------------------------------------------------------------------------
# GDD 4 / 9 – Geschwindigkeitsmodell
#
# Die Kalibrierfunktion aus GDD 9 ist linear in p = sqrt(S / referenz):
#     v(S) = 55 + 125 * p   [km/h]
# Das Kurvenlimit folgt aber v = sqrt(a * r). Damit die Geschwindigkeit
# linear in p herauskommt, muss die Haftung quadratisch in p wachsen:
#     a(S) = haftung_referenz * (anteil_bei_null + (1 - anteil_bei_null) * p)^2
# Bei S = referenz ist a = haftung_referenz, bei S = 0 entsprechend kleiner.
#
# Aus diesem gemeinsamen Haftungsniveau ergeben sich die vier
# Beschleunigungsgrenzen ueber feste Faktoren. Jede zieht ihr S aus einem
# eigenen Wirkungsbereich der Matrix in GDD 8, die Faehigkeiten bleiben
# also getrennt.
#
# Die Endgeschwindigkeit bei S = 0 ist an dasselbe anteil_bei_null
# gekoppelt:
#     v_max(S) = hoechst_referenz * (anteil_bei_null + (1 - anteil_bei_null) * p)
# Ohne diese Kopplung waere das Modell durch GDD 9 nicht eindeutig bestimmt:
# Man kann mehr Endgeschwindigkeit gegen weniger Haftung tauschen und trifft
# denselben Rundenschnitt. Die Wahl verschiebt aber das Verhaeltnis zwischen
# schnellen und kurvigen Strecken, darf also nicht dem Zufall der Anpassung
# ueberlassen bleiben. Die Kopplung sagt: Bei S = 0 kann das Auto in jeder
# Hinsicht denselben Bruchteil dessen, was es bei S = referenz kann.
#
# haftung_referenz und anteil_bei_null sind gegen die Kalibriertabelle aus
# GDD 9 gefittet; erzeugt von werkzeuge/kalibriere.py. Nicht von Hand
# aendern, ohne neu zu kalibrieren.
# ---------------------------------------------------------------------------
[tempo]
haftung_referenz = 20.788
anteil_bei_null = 0.3056
# Verhaeltnisse der Grenzen zueinander
faktor_enge_kurve = 0.75
faktor_kurve = 1.00
faktor_bremsen = 1.15
faktor_beschleunigen = 0.45
# Endgeschwindigkeit auf Geraden, getrennt skaliert bis 400 km/h in Liga 1
hoechstgeschwindigkeit_bei_referenz_kmh = 400.0

# ---------------------------------------------------------------------------
# GDD 9 / 12 – Das Feld
# ---------------------------------------------------------------------------
# Punkt 101: Eine einzige Liga zu 50 Autos. Ligen, Korridore, Ueberlappung
# und Auf- und Abstieg gibt es nicht mehr; geblieben ist die Spanne des
# Feldes auf der Werteskala.
#
# Der Beste faehrt den Anker der Kalibrierung - S = 98.000, in Zandvoort
# 180,00 km/h. Der Letzte braucht fuer dieselbe Runde 4 % laenger. Weil
# jede Grenze des Tempomodells linear im Leistungsanteil
# p = sqrt(S / referenz) steht, ist das genau die Umkehrung der
# Kalibrierfunktion:
#
#     v_letzter = 180 / 1,04           = 173,077 km/h
#     p_letzter = (173,077 - 55) / 125 =   0,944615
#     s_letzter = p_letzter^2 * 98.000 =  87.445
#
# Nachgemessen: S = 87.445 faehrt in Zandvoort 88,282 s gegen 84,887 s des
# Besten, also +3,9994 %. Die Pruefung rechnet das bei jedem Start nach.
[feld]
s_bester = 98_000
s_letzter = 87_445
# Um wie viel die Rundenzeit des Letzten ueber der des Besten liegt.
# Pruefwert zu s_letzter, nicht selbst benutzt.
spanne_rundenzeit = 0.04

# ---------------------------------------------------------------------------
# GDD 2 – Kalender und Zeitmodell
# ---------------------------------------------------------------------------
[kalender]
# Jahr der ersten Saison. Danach zaehlt jeder Saisonwechsel eines hoch;
# die Karriere ist endlos (GDD 13).
startjahr = 2026
# Erstes Rennen am ersten Sonntag ab dem 01.03.
saisonstart_monat = 3
saisonstart_tag = 1
rennen_je_saison = 20
abstand_tage = 14
nutzbare_tage_je_zyklus = 10
# Qualifying Samstag, Rennen Sonntag
qualifying_wochentag = 5   # 0 = Montag
rennen_wochentag = 6
# Vorsaison ab 01.01., Nachsaison bis 31.12.; Saisonwechsel 31.12./01.01.
vorsaison_start_monat = 1
vorsaison_start_tag = 1
nachsaison_ende_monat = 12
nachsaison_ende_tag = 31

# Keinen Bonus fuers Durchhalten: Bricht ein Ereignis das Programm ab,
# zahlt es genau die geleisteten Tage aus. Die Zeit war dann nicht
# umsonst, aber der Rest ist verloren.

# ---------------------------------------------------------------------------
# GDD 3 – Streckenmodell
# ---------------------------------------------------------------------------
[strecke]
# Linie auf festen Punktabstand neu abtasten
abtastabstand_m = 5.0
# Segmenttyp aus dem Kruemmungsradius
enge_kurve_radius_max_m = 60.0
gerade_radius_min_m = 300.0

# Nur Geraden ab dieser Laenge sind Ueberholzonen
ueberholzone_mindestlaenge_m = 100.0
sektoren = 4
quelle = "TUMFTM/racetrack-database"
lizenz = "LGPL-3.0"
# Die CSV-Dateien liegen unter daten/strecken/ und werden mitgepackt.
verzeichnis = "daten/strecken"
# Die Autos fahren auf der Ideallinie (GDD 3).
linie = "ideallinie"
# Segmenttypen rein nach Radius, ohne Mindestlaenge - das GDD nennt keine.
mindestsegmentlaenge_m = 0.0

# Punkt 88: Die Strecke gummiert ein (Entscheidung des Auftraggebers).
# Der Stand zaehlt gefahrene **Auto-Runden** - jede Runde jedes Autos auf
# dieser Strecke in dieser Session. Daraus wird der Grip-Aufschlag:
#
#   faktor(n) = 1 + max_anteil * (1 - e^(-n / halbwert_runden))
#
# Der Grip streckt das ganze Geschwindigkeitsprofil um genau seinen
# Faktor, ein Prozent Grip ist also ein Prozent Rundenzeit. Weil eine
# Runde rund anderthalb Minuten dauert, ist das ungefaehr eine Sekunde
# (gemessen Zandvoort -0,84 s, Sakhir -0,95 s, Spa -1,13 s). Mit den
# Werten unten:
#
#   Qualifying, letzter Starter (n=58)   0,16 %   -0,14 s
#   Rennen nach 10 Runden    (n=300)     0,68 %   -0,57 s
#   Rennen nach 40 Runden    (n=1200)    1,36 %   -1,15 s
#
# Der Vorsprung des letzten Quali-Starters auf den ersten liegt damit bei
# 0,14 s. Das ist spuerbar, aber nicht entscheidend - wichtig, weil die
# Startreihenfolge der umgekehrte Meisterschaftsstand ist (GDD 4) und der
# Fuehrende sonst systematisch bevorzugt waere.
[strecke.gummierung]
max_anteil = 0.015
halbwert_runden = 500

# Weiche Reifen tragen mehr Gummi auf und holen auch mehr daraus heraus
# (Entscheidung des Auftraggebers). Beides kommt aus derselben
# Eigenschaft - wie weich der Reifen ist -, und die steht schon als
# ``verschleiss`` in [reifen.mischungen]. Es braucht deshalb keine
# zweite Tabelle, nur einen Bezug und einen Exponenten:
#
#   Auftrag    =  verschleiss / verschleiss(Bezug)
#   Ansprechen = (verschleiss / verschleiss(Bezug)) ^ ansprechen_exponent
#
# Mit Bezug "M" (0,88) und Exponent 0,5:
#
#             Auftrag  Ansprechen
#   Weich        1,44        1,20
#   Mittel       1,00        1,00
#   Hart         0,73        0,85
#
# Der Auftrag ist linear: Gummi auf der Strecke **ist** abgefahrener
# Reifen, was 1,44-mal so schnell abbaut, laesst 1,44-mal so viel
# liegen. Das Ansprechen ist gedaempft - dass sich ein weicher Reifen
# besser in den liegenden Gummi einarbeitet, ist der schwaechere
# Zusammenhang. Ein Exponent statt fuenf erfundener Zahlen, und genau
# eine Stellschraube.
#
# Der Auftrag gilt nur beim **Aufbau**. Abgewaschen wird vom Regen, nicht
# vom Reifen; ein Intermediate darf nicht staerker abwaschen als ein
# Regenreifen.
#
# Gemessen in Zandvoort nach 40 Runden: Weich -1,37 s, Mittel -1,14 s,
# Hart -0,97 s. Der Unterschied Weich gegen Hart erreicht damit 23 %
# dessen, was die Mischung an sich ausmacht (1,70 s) - spuerbar, aber er
# stellt die Mischungswahl nicht auf den Kopf. Bei Exponent 1,0 waeren es
# 53 %, und ein spaeter weicher Stint waere fast erzwungen.
bezugsmischung = "M"
ansprechen_exponent = 0.5

# Punkt 90: Die gruene Strecke frisst Reifen. Rauer Asphalt schmirgelt,
# eingegummierter Asphalt traegt - derselbe Stand, der den Grip hebt,
# senkt also auch den Verschleiss. Der Faktor laeuft ueber dieselbe
# Kurve wie der Grip, nur von ``verschleiss_gruen`` nach
# ``verschleiss_voll``:
#
#   Verschleissfaktor(n) = gruen + (voll - gruen) * (1 - e^(-n / halbwert))
#
# **Umverteilung, nicht mehr Verschleiss.** Die beiden Zahlen sind so
# gewaehlt, dass ein volles Rennen ueber alles gerechnet ungefaehr dort
# herauskommt, wo es vorher lag - der Verschleiss wandert nur vom Ende
# an den Anfang. Das Verhaeltnis 1,15 zu 0,928 ist 1,24: Der erste Stint
# faellt rund ein Fuenftel kuerzer aus als der letzte. Ein Stint, der in
# der Rennmitte 20 Runden traegt, traegt am Anfang 18 und am Ende 21.
#
# **Keine Mischung darin.** Wie stark der Asphalt schmirgelt, ist eine
# Eigenschaft der Strecke, nicht des Reifens; hier steht deshalb kein
# Auftrag und kein Ansprechen.
#
# Der Planer rechnet diesen Faktor **mit** (die Strecke frisst am Anfang
# mehr, das gehoert in die Stintlaenge), den wachsenden Grip aber
# **nicht** - so hat es der Auftraggeber festgelegt.
verschleiss_gruen = 1.15
verschleiss_voll = 0.928

# Was eine gefahrene Auto-Runde je Lage am Stand aendert. Trocken und
# heiss bauen auf, Regen waescht ab, wechselhaft nur sehr wenig. Wird es
# nach dem Regen wieder trocken, baut sich derselbe Stand wieder auf.
[strecke.gummierung.je_runde]
trocken = 1.0
heiss = 1.0
wechselhaft = -0.05
regen = -1.5
starkregen = -3.0

