# ---------------------------------------------------------------------------
# GDD 4 – Reifen (nur Verschleiss, Boxenstopps spaeter)
# ---------------------------------------------------------------------------
[reifen]
verschleiss_aktiv = true
boxenstopps = false
kraftstoff = false
# Verschleiss senkt das Tempo und erhoeht die Fehlerquote
wirkt_auf = ["tempo", "fehlerquote"]

# ---------------------------------------------------------------------------
# GDD 15 – Technik
# ---------------------------------------------------------------------------
[technik]
spielstand_format = "sqlite"
konfigurationsformat = "toml"
debug_ansicht = true
massensimulation = true
seed_eingabe = true

# ---------------------------------------------------------------------------
# Entscheidungen zu den Luecken im GDD
#
# Das GDD nennt 20 Mechaniken, ohne sie zu beziffern. Die Werte unten sind
# am 2026-09-17 entschieden; Varianten und Begruendung stehen in
# OFFENE_PUNKTE.md. Der frueher hier stehende Abschnitt [offen] ist leer.
# ---------------------------------------------------------------------------
[offen]
# Alle Punkte entschieden, siehe OFFENE_PUNKTE.md.

# --- Punkt 2: Ueberholschwierigkeit je Strecke (GDD 3) ---------------------
[ueberholschwierigkeit]
# Entscheidung B: aus dem Anteil der Ueberholzonen an der Rundenlaenge,
# normiert auf den Mittelwert aller 20 Strecken. Nur Geraden ab 100 m
# zaehlen, denn nur dort darf ueberholt werden.
grundlage = "ueberholzonenanteil"
normieren_auf_mittelwert = true

# --- Punkt 3: Erfolgsformel beim Ueberholen (GDD 4) ------------------------
[ueberholen.erfolg]
# Entscheidung B: logistisch. Nur diese Form bleibt in den Randlagen
# sinnvoll - alle Fahrer starten laut GDD 1 bei 0.
#   p = sigmoid(gewicht_koennen * (D10 - D11) / skala
#               + gewicht_tempo * (dv - min_tempovorteil) / tempo_bezug)
#       * streckenfaktor
# Die beiden Gewichte werden in Schritt 4 an einer Massensimulation
# nachgezogen; die Startwerte stehen hier.
form = "logistisch"
gewicht_koennen = 4.0
gewicht_tempo = 1.0
tempo_bezug_kmh = 10.0
wahrscheinlichkeit_min = 0.05
wahrscheinlichkeit_max = 0.95

# --- Punkt 4: Wetterprofil je Strecke (GDD 3 und 16) ----------------------
# Entscheidung A: drei Klimaprofile. Gewichte je Wetterlage.
# Punkt 39: Darueber liegt eine Saisonebene. "gewichte" gilt weiter, wo
# ohne Saison gewuerfelt wird (Tests, Editor); im Spiel wuerfelt jede
# Saison aus "band" ihre eigenen Gewichte. So gibt es nasse und trockene
# Jahre, statt dass jedes Jahr gleich aussieht.
[wetter.profil.heiss_trocken]
strecken = ["Sakhir", "Yas Marina", "Mexiko-Stadt", "Austin", "Sao Paulo", "Melbourne", "Shanghai"]
gewichte = { starkregen = 2, regen = 8, wechselhaft = 15, trocken = 45, heiss = 30 }
# Wueste: wechselhaftes Wetter praktisch nie.
band = { starkregen = [0, 1], regen = [0, 3], wechselhaft = [0, 2], trocken = [40, 60], heiss = [35, 55], wechselneigung = [0.00, 0.02] }

[wetter.profil.gemaessigt]
strecken = ["Catalunya", "Monza", "Budapest", "Suzuka", "Montreal", "Spielberg"]
gewichte = { starkregen = 5, regen = 15, wechselhaft = 20, trocken = 45, heiss = 15 }
band = { starkregen = [0, 2], regen = [1, 5], wechselhaft = [2, 8], trocken = [55, 75], heiss = [16, 32], wechselneigung = [0.05, 0.25] }

[wetter.profil.regenreich]
strecken = ["Spa", "Zandvoort", "Silverstone", "Nuerburgring", "Hockenheim", "Norisring", "Oschersleben"]
gewichte = { starkregen = 10, regen = 25, wechselhaft = 25, trocken = 35, heiss = 5 }
# Hier ist die Wechselneigung am hoechsten - bis zu den 40 %, die der
# Auftraggeber als Obergrenze gesetzt hat.
band = { starkregen = [0, 3], regen = [3, 9], wechselhaft = [4, 13], trocken = [55, 72], heiss = [5, 14], wechselneigung = [0.10, 0.40] }

# Hoechstens zwei Wechsel je Rennen, und immer nur eine Stufe der Kette -
# einen Sprung von trocken auf Starkregen gibt es nicht.
[wetter.saison]
wechsel_max = 2

# --- Punkt 5: Streckennaesse (GDD 7) --------------------------------------
[wetter.naesse]
# Entscheidung B: der Grip naehert sich dem neuen Wetter ueber 3 Runden an,
# statt hart zu springen.
verzoegerung_runden = 3

# --- Punkt 21: Tempobonus der Trockenroutine (GDD 7) ----------------------
# GDD 7: "bei Trocken gibt sie einen kleinen Tempobonus" - ohne Zahl. Bei
# Trocken gibt es keinen Gripverlust zu daempfen, also braucht die
# Faehigkeit eine eigene Wirkung. Gewaehlt: bis +0,5 % bei 100.000, also
# ein Drittel dessen, was die Streckenkenntnis maximal bringt (GDD 6).
[wetter.trockenbonus]
max_anteil = 0.005

# --- Punkt 22: Daempfung der schlechten Tagesform durch D16 (GDD 11) ------
# GDD 11: "D16 Mentale Staerke begrenzt nur die negative Seite der
# Tagesform" - ohne Zahl. Gewaehlt: dieselbe Obergrenze wie bei den
# Wetterfaehigkeiten, damit die Skala einheitlich bleibt.
[zufall.tagesform.daempfung]
faehigkeit = "D16"
max_anteil = 0.60

# --- Punkt 23: Wirkung von D12 Konstanz auf die Rundenform (GDD 11) -------
# GDD 11: "verkleinert durch D12 Konstanz" - ohne Zahl. Gewaehlt: dieselbe
# Obergrenze; bei 100.000 bleibt ein Fuenftel der Streuung uebrig.
[zufall.rundenform.daempfung]
faehigkeit = "D12"
max_anteil = 0.80

# --- Punkt 95: Die Sektorform haengt am Platzgewinn -----------------------
# Wer im Sektor davor Plaetze gutgemacht hat, faehrt den naechsten mit
# hoeherer Wahrscheinlichkeit ueber seiner Form; wer Plaetze verloren hat,
# umgekehrt. Gezogen wird der **Betrag** |normal(0, sigma)|, das Vorzeichen
# faellt mit dieser Wahrscheinlichkeit gut aus:
#
#     p(d) = 0,5 + 0,5 * (1 - rest^|d|) * Vorzeichen(d)
#     rest = 2 - 2 * bei_einem_platz
#
# Bei einem gewonnenen Platz sind das die gesetzten 3/4, bei zwei 0,875,
# bei drei 0,9375 - es naehert sich 1, ohne es zu erreichen. Ein Fahrer
# wird also nie sicher schnell. Bei p = 0,5 ist die Verteilung rechnerisch
# wieder die Normalverteilung; ohne Platzaenderung aendert sich nichts.
[zufall.rundenform.kopplung]
bei_einem_platz = 0.75

# --- Punkt 24: Wirkung der Q-Spalte auf die gezeitete Runde (GDD 8) -------
# GDD 8: "die Q-Spalte ist ein zusaetzliches Gewicht nur fuer die gezeitete
# Runde" - ohne Umrechnung in Zeit. Gewaehlt: ein Tempobonus wie bei der
# Streckenkenntnis, bis +1,0 % bei 100.000. Innerhalb einer Liga ist die
# Spanne der Q-Werte schmal, der Unterschied betraegt dort wenige
# Hundertstel je Runde.
[qualifying.bonus]
max_anteil = 0.01

# --- Punkte 6 bis 9: Fehler, Unfaelle, Defekte, Reifen (GDD 4) -------------
[fehler]
# Entscheidung B: bei Wert 0 rund ein Fehler je 10 Runden, bei 100.000 je 100.
# Der Wetter-Multiplikator aus [wetter.zustand] kommt obendrauf.
rate_bei_null = 0.10
rate_bei_maximum = 0.01

# Punkt 61: Ein Fehler kostet Zeit im **Stand**, nicht als Abzug: Das Auto
# geht auf 0 km/h, steht diese Zeit und beschleunigt danach mit seiner
# eigenen Beschleunigungskurve wieder an. Der wirkliche Verlust ist
# deshalb groesser als die Zahlen hier - das Wiederanfahren kommt obendrauf.
#
# Punkt 96: Die Zeit ist nicht mehr fuer jeden dieselbe. Der Auftraggeber
# hat die Verteilung ueber ihre Streuungsbaender beschrieben - der Gipfel
# bei 1,2 s, und um ihn herum:
#
#     1 Sigma  (68,3 %)     0,80 bis 1,80 s
#     2 Sigma  (95,4 %)     0,60 bis 3,00 s
#     4 Sigma  (99,99 %)    0,32 bis 4,60 s
#     harte Grenzen         0,30 bis 5,00 s
#
# Genau das steht in der Tabelle: je Stuetzstelle der Anteil der Fehler
# darunter und die Sekunden dazu, dazwischen linear. Nach rechts laeuft
# sie weit aus - ein Dreher kostet eben ein Vielfaches eines Verbremsers -,
# nach links laeuft sie in eine Grenze, unter die kein Fehler faellt.
[fehler.zeitverlust]
# Der Erwartungswert, auf den die Tabelle beim Laden skaliert wird. Damit
# aendert die Streuung das Balancing **nicht**: Ein Rennen verliert
# insgesamt so viel Zeit an Fehler wie mit der frueheren festen Zahl, nur
# ungleich verteilt. Die Tabelle kommt von sich aus auf 1,3716 s und wird
# deshalb mit 0,9113 gestaucht; danach liegt der Gipfel bei 1,09 s, die
# Baender bei 0,73/1,64, 0,55/2,73 und 0,29/4,19 und die Grenzen bei 0,27
# und 4,56 s. Wer die Eckwerte unveraendert sehen will, setzt hier 1372.
mittelwert_ms = 1250
# Anteil der Fehler unterhalb der Stuetzstelle. Die krummen Zahlen sind die
# Quantile der Sigma-Baender: 0,158655 ist (1 - 68,27 %) / 2 und so fort.
anteil = [0.0, 0.000032, 0.022750, 0.158655, 0.5, 0.841345, 0.977250, 0.999968, 1.0]
# Die Standzeit dazu, in Sekunden.
sekunden = [0.30, 0.32, 0.60, 0.80, 1.20, 1.80, 3.00, 4.60, 5.00]

[unfaelle.rate]
# Entscheidung A: sehr selten, wie im GDD ausdruecklich verlangt. Die
# Obergrenze von 0 bis 5 Ausfaellen je Rennen ist eine Decke, kein Ziel.
#
# Die Rate gilt je Sekunde, in der zwei Autos naeher als 30 m beieinander
# sind - nicht je Zeitschritt. Mit 50 Schritten je Sekunde und einem
# dichten Feld waere eine Rate je Schritt um den Faktor 50 zu hoch; in
# einem Probelauf fielen dadurch alle fuenf erlaubten Ausfaelle in der
# ersten Runde.
je_sekunde_in_reichweite = 0.00002
anteil_ein_auto = 0.75
anteil_beide_autos = 0.25

[defekte.rate]
# Entscheidung B: deutlich haeufiger als Unfaelle, damit F14
# Zuverlaessigkeit spuerbar wirkt.
je_auto_und_rennen_bei_null = 0.05
je_auto_und_rennen_bei_maximum = 0.005

[reifen.verschleiss]
# Punkt 39: Je Fahrer, Mischung und Rennen zwei kleine Wuerfe - plus
# oder minus diesen Betrag, gleichverteilt, getrennt auf den
# Verschleissfaktor und auf den Tempofaktor der Mischung. Beide stehen
# bewusst **nicht** in der Vorausberechnung der Varianten: Geplant wird
# auf den Sollwerten, gefahren wird mit der Streuung. Dass es
# auseinanderlaeuft, ist so gewollt - eine Strategie geht im Rennen mal
# knapper, mal bequemer auf als auf dem Papier.
#
# Der Verschleiss streut zehnmal so weit wie das Tempo: 0,02 auf einen
# Faktor von 0,70 bis 1,30 sind rund zwei bis drei Prozent Haltbarkeit,
# beim Tempo waeren zwei Prozent das ganze Feld von hart bis weich.
streuung_verschleiss = 0.02
streuung_tempo = 0.002
# Entscheidung B: progressiv - erst flach, letztes Drittel steil.
#
#   zustand:      1,0 frisch bis 0,0 abgefahren
#   verschleiss:  1 - zustand
#   tempoverlust: aus der Gripkurve unten
#
# Wie schnell der Verschleiss waechst, haengt vom Bereich ve der
# Wirkungsmatrix ab (F10 Reifenhaltbarkeit, F14, F16, D14
# Reifenmanagement). Ein Auto bei S = 0 faehrt die Reifen ueber die
# Renndistanz voll ab, eines bei S = referenz nur zum Teil - die Spanne
# steht unten.
# Punkt 39: Die alte Parabel ist abgeloest. Der Grip haengt jetzt an einer
# Kurve mit **Optimum bei 85 % Restprofil** - ein frischer Reifen ist
# also nicht der schnellste. Das ist die wichtigste Aenderung am
# Reifenmodell: Erst dadurch ist ein langer Stint etwas wert und ein
# frueher Stopp ein Risiko.
#
# Die Form kommt vom Auftraggeber:
#   100-95  steiler Gripanstieg
#    95-85  weiter steil, flacher werdend bis zum Optimum
#    85-70  langsamer Abfall
#    70-40  halb so steil wie frueher - hier liegt der brauchbare Stint
#    40- 0  erst flach, dann von Stufe zu Stufe steiler
#   bei  0  noch 0,30 Grip, also nicht unfahrbar
#
# Der Anfang wurde nachgeschaerft: Frueher stand der frische Reifen bei
# 0,940 und stieg bis 0,985 auf 95 %. Der Auftraggeber wollte den
# Abstand zum Optimum **verdoppelt** und den Anstieg entsprechend
# steiler - jetzt 0,880 auf 0,970. Fuer ein Auto mit dem
# Referenz-Reifenfluesterer heisst das: Tempofaktor 0,952 statt 0,976 in
# der ersten Runde nach Start und Stopp, und eine um 4 Prozent erhoehte
# Fehlerquote statt 3.
#
# Punkt 89: Der Auftraggeber hat die Kurve neu gelegt. Drei Aenderungen:
#
# * **Der frische Reifen steht auf 0,900** statt 0,880 - der Einfahrweg
#   ist etwas kuerzer, der Anstieg auf 0,970 bei 95 % bleibt.
# * **Die Mitte ist flacher.** Von 85 auf 50 Prozent faellt sie nur noch
#   von 1,000 auf 0,975, frueher auf 0,956. Ein langer Stint kostet damit
#   weniger, und die Entscheidung "noch eine Runde" ist echter.
# * **Das Ende ist tiefer und laeuft anders.** Bei 40 Prozent 0,945 statt
#   0,928, bei 30 Prozent 0,860 statt 0,830 - danach aber bis auf 0,450
#   statt 0,300, und zwar **erst flach, dann immer steiler**. Der Abfall
#   je fuenf Punkte Restprofil waechst von 0,010 auf 0,110. Ein Reifen
#   unter dreissig Prozent stirbt damit nicht sofort, aber er stirbt.
#
# Stuetzstellen: Restprofil -> Grip. Dazwischen wird linear interpoliert;
# unter dreissig Prozent stehen sie im Fuenferschritt, damit die
# zunehmende Steilheit nicht zu einem Knick zusammenfaellt.
verlauf = "optimum_bei_85"
zustand_stuetzstellen = [1.00, 0.95, 0.90, 0.85, 0.80, 0.70, 0.65, 0.60, 0.50, 0.40, 0.30, 0.25, 0.20, 0.15, 0.10, 0.05, 0.00]
grip_stuetzstellen   = [0.900, 0.970, 0.992, 1.000, 0.996, 0.989, 0.986, 0.982, 0.975, 0.945, 0.860, 0.850, 0.820, 0.770, 0.700, 0.610, 0.500]
# Der Boden liegt bei 0,500 (Entscheidung des Auftraggebers). Der Abfall
# je fuenf Punkte Restprofil waechst von 0,010 auf 0,110 - erst zoegert
# der Reifen, dann faellt er.
exponent = 2.0
# Der Tempoverlust steht nicht mehr hier: Er kommt aus der Gripkurve
# oben. Zwei Modelle nebeneinander haetten gegeneinander gerechnet.
# Zuschlag auf die Fehlerquote am Kurvenboden.
fehlerzuschlag_voll = 1.0
# Verschleiss ueber die volle Renndistanz, je nach Bereich ve:
#   bei S = 0         verschleiss_bei_null       (Reifen sind am Ende hin)
#   bei S = referenz  verschleiss_bei_referenz   (halten locker durch)
# Gemessen so gewaehlt, dass sich die Zustaende am Rennende spreizen
# statt gemeinsam bei null zu liegen - waeren am Ende alle Reifen hin,
# waeren auch alle wieder gleich schnell.
verschleiss_bei_null = 1.00
verschleiss_bei_referenz = 0.35

[reifen.fluesterer]
# Neue Fahrereigenschaft neben den 16 aus GDD 6, aufgebaut wie die
# Wetterfaehigkeiten aus GDD 7: Sie steht ausserhalb der Wirkungsmatrix
# und zaehlt nicht zum Durchschnitt der Basiseigenschaften.
#
# Unterschied zu D14 Reifenmanagement: D14 senkt, wie schnell die Reifen
# abbauen. Der Reifenfluesterer senkt, wie sehr abgebaute Reifen wehtun -
# er holt aus schlechten Reifen noch Zeit heraus.
schluessel = "reifenfluesterer"
name = "Reifenfluesterer"
waehrung = ["E", "Z"]
max_daempfung = 0.60

# ---------------------------------------------------------------------------
# Eigenschaften neben der Wirkungsmatrix
# ---------------------------------------------------------------------------
# Fuenf Eigenschaften, die das GDD nicht kennt; entschieden mit dem
# Auftraggeber (OFFENE_PUNKTE.md, Punkt 48). Sie stehen bewusst *neben* der
# Wirkungsmatrix aus GDD 8 - wie die Wetterfaehigkeiten aus GDD 7 und der
# Reifenfluesterer. So bleiben Gesamtwert, Bereichswerte und damit die
# Kalibriertabelle aus GDD 9 unberuehrt.
#
# ``traeger`` sagt, wem eine Eigenschaft gehoert: Fahrerwerte traegt die
# Tagesform aus GDD 11, und sie belegen den Fahrerplatz aus GDD 2;
# Fahrzeugwerte gehoeren der Werkstatt. Ohne Angabe gilt "fahrer".
[[zusatzfaehigkeit.liste]]
schluessel = "windschatten"
name = "Windschattennutzung"
traeger = "fahrer"
waehrung = ["E"]

[[zusatzfaehigkeit.liste]]
schluessel = "kaltreifen"
name = "Kaltreifen"
traeger = "fahrer"
waehrung = ["E", "Z"]

[[zusatzfaehigkeit.liste]]
schluessel = "materialgefuehl"
name = "Materialgefuehl"
traeger = "fahrer"
waehrung = ["E"]

[[zusatzfaehigkeit.liste]]
schluessel = "rhythmus"
name = "Rhythmus"
traeger = "fahrer"
waehrung = ["E", "Z"]

[[zusatzfaehigkeit.liste]]
schluessel = "bremskuehlung"
name = "Bremskuehlung"
traeger = "fahrzeug"
waehrung = ["G", "E"]

# --- Punkt 5: Popularitaet -------------------------------------------------
[popularitaet]
# Wie bekannt ein Fahrer ist. Sie bewegt den Grundbetrag der
# Sponsorenangebote aus GDD 10 um bis zu 25 Prozent.
#
# Der Anfangswert ist gestreut, aber ausdruecklich *nicht* nach
# Ligastaerke - so mit dem Auftraggeber abgestimmt: Bekanntheit ist nicht
# dasselbe wie Schnelligkeit. Ein Liga-20-Fahrer kann bekannter sein als
# ein Liga-1-Fahrer.
# ``mittelwert`` ist zweierlei: der Mittelwert der Anfangsverteilung und
# der Punkt, an dem der Sponsorenfaktor genau 1,0 ist. Ohne diesen Bezug
# laege das ganze Feld unter 1,0, und die Sponsorenbetraege aus GDD 10
# fielen auf einen Schlag.
mittelwert = 30000
anfang_streuung = 0.80
max_anteil_sponsor = 0.25
# Was ein Rennwochenende einbringt. Sieg, Podium und Pole zaehlen
# nebeneinander: Ein Sieg von der Pole bringt alle drei.
je_sieg = 1200
je_podium = 500
je_pole = 300

# --- Punkt 2: Heimstrecke --------------------------------------------------
[heimstrecke]
# Auf einer Strecke im eigenen Land bekommt ein Fahrer einen kleinen Bonus
# auf fuenf Eigenschaften. Welche fuenf, wird jedes Rennwochenende neu
# gezogen - aus den 32 der Wirkungsmatrix und denen daneben.
#
# Abgestimmt mit dem Auftraggeber: Wer kein Land mit Strecke im Kalender
# hat, geht leer aus. Das betrifft 388 der 600 Fahrer; die Laender der 20
# Strecken decken 212 ab.
eigenschaften = 5
bonus_min = 0.005
bonus_max = 0.010

# --- Punkt 15: Rhythmus ----------------------------------------------------
[rhythmus]
# Vorteil auf Strecken mit vielen aufeinanderfolgenden Kurven. Er wirkt auf
# die Querbeschleunigung in normalen Kurven, nicht auf enge - Kurvenfolgen
# sind fliessende Passagen.
#
# Zwei Terme, beide auf -1 bis +1 gebracht:
#   * Strecke: Kurvenfolgenanteil gegen den Mittelwert aller 20 Strecken.
#     Zandvoort liegt bei 1,77x, Monza bei 0,23x.
#   * Fahrer: -1 bei Wert 0, 0 bei der Haelfte des Leistungsanteils, +1 bei
#     vollem Wert. Wer den Rhythmus nicht hat, verliert dort also.
max_anteil_quer = 0.015

# --- Punkt 13: Materialgefuehl ---------------------------------------------
[materialgefuehl]
# Die Fahrerseite der Zuverlaessigkeit: F14 senkt, wie oft ein Auto kaputt
# geht, dieser Wert senkt es zusaetzlich. Faktor auf die Defektrate.
faktor_bei_null = 1.00
faktor_bei_maximum = 0.60

# --- Punkt 7: Windschatten -------------------------------------------------
[windschatten]
# Der Sog hinter einem anderen Auto. Er wirkt nur auf Geraden und nur im
# Fenster von 30 m bis auf gleiche Hoehe; dicht dahinter am staerksten,
# bei 30 m gar nicht mehr.
#
# Je Gerade gibt es ihn einmal: Wer einmal auf gleicher Hoehe war, ist aus
# dem Sog heraus und bekommt ihn auf dieser Geraden nicht wieder. So
# abgestimmt mit dem Auftraggeber (OFFENE_PUNKTE.md, Punkt 48).
fenster_m = 30.0
gewinn_bei_null = 0.010
gewinn_bei_maximum = 0.025
# Nachlauf: Wer vorbei ist, faellt nicht schlagartig aus dem Sog. Der
# Ueberschuss gilt noch ``nachlauf_m`` Meter in voller Hoehe, danach mit
# dem Anteil ``nachlauf_anteil`` bis zum Ende derselben Geraden - also bis
# zum Anbremsen. Das macht ein Ueberholmanoever haltbar, statt das Auto
# gleich hinter dem Ueberholten wieder einbrechen zu lassen.
nachlauf_m = 50.0
nachlauf_anteil = 0.5
# Der Ueberholte haengt sich an: Sobald der Ueberholende nur noch den
# reduzierten Ueberschuss hat, bekommt der Ueberholte davon die Haelfte -
# vorher gar nichts. So bleibt das Duell offen, ohne dass der gerade
# Ueberholte im Sog sofort zurueckschlaegt.
nachlauf_anteil_ueberholter = 0.5

[reifen.streckenfaktor]
# Entscheidung A: aus der Querbeschleunigung, also der Summe von 1/Radius
# ueber die Runde, normiert auf den Mittelwert aller 20 Strecken. Trennt
# schnelle Kurven (Suzuka) von engen (Zandvoort), was der blosse
# Kurvenanteil nicht leistet.
grundlage = "querbeschleunigung"
normieren_auf_mittelwert = true

# Punkt 92: Wie stark der Charakter der Strecke auf den **Verschleiss**
# durchschlaegt. Der rohe Faktor spannt von 1,263 (Zandvoort) bis 0,537
# (Monza) - das 2,35fache. So weit auseinander lassen sich die
# Stoppzahlen nicht mehr einfangen: Monza kommt mit einem Stopp aus und
# braucht nie einen zweiten, Zandvoort schafft keinen Zwei-Stopp mehr.
# Der Auftraggeber will 2 bis 3 Stopps in Zandvoort und 1 bis 2 in
# Monza; dafuer duerfen sich die Stintlaengen hoechstens um das
# 1,5fache unterscheiden.
#
#   wirksam = roh ^ verschleiss_exponent
#
# | Exponent | Zandvoort | Monza | Spanne | Stopps Zandvoort | Monza |
# |      1,0 |     1,263 | 0,537 |   2,35 |              2-4 |   0-1 |
# |      0,7 |     1,178 | 0,647 |   1,82 |              2-4 |   1-2 |
# |      0,5 |     1,124 | 0,733 |   1,53 |              2-3 |   1-2 |
# |      0,4 |     1,098 | 0,780 |   1,41 |              1-4 |   1-2 |
#
# Der Exponent wirkt **nur auf den Verschleiss**, nicht auf den Faktor
# selbst: ``weich_hoechstens_streckenfaktor`` vergleicht weiter gegen
# den rohen Wert, sonst faellt die Regel auf allen zwanzig Strecken weg.
verschleiss_exponent = 0.5

# --- Punkt 11: Ermuedung (GDD 8) ------------------------------------------
[ermuedung]
# Entscheidung B: wirkt erst ab der halben Distanz, damit das Rennende
# gepraegt wird und nicht der Start.
#
# Die Betraege sind mit Punkt 48 nachgezogen worden: Bei vollem Wert
# bleibt ein kleiner Rest, sonst waere der Bereich ``er`` aus GDD 8 fuer
# starke Fahrer wirkungslos. Gerechnet wird gegen den Leistungsanteil
# p = sqrt(S / referenz), wie ueberall in GDD 9.
beginn_anteil_distanz = 0.5
tempoverlust_am_ende_bei_null = 0.020
tempoverlust_am_ende_bei_maximum = 0.003

# --- Punkt 48: Kaltreifen und Bremskuehlung -------------------------------
# Zwei Verlaeufe ueber die Renndistanz, aufgebaut wie die Ermuedung: Der
# eine fehlt am Anfang, der andere laesst gegen Ende nach.
[kaltreifen]
# Tempoverlust beim Start, abgebaut ueber die erste Runde. Gilt nur fuer
# den Rennstart, nicht nach jedem Halt - so steht es in der abgestimmten
# Tabelle zu Punkt 48.
tempoverlust_bei_null = 0.030
tempoverlust_bei_maximum = 0.005
aufwaermstrecke_runden = 1.0

[bremskuehlung]
# Verlust der *Bremsgrenze* am Rennende, nicht des Tempos: Was er kostet,
# haengt davon ab, wie viel auf der Strecke gebremst wird. Das
# Geschwindigkeitsprofil wird deshalb zweimal gebildet - einmal mit voller
# Bremse, einmal mit der Bremse des Rennendes - und dazwischen linear nach
# gefahrener Distanz gemischt.
verlust_am_ende_bei_null = 0.040
verlust_am_ende_bei_maximum = 0.005

# --- Punkte 12 bis 19: Geld (GDD 9, 10, 14) -------------------------------
[preisgeld.interpolation]
# Entscheidung A: logarithmisch. Das GDD begruendet die Preisgelder relativ
# ("Aufstieg in etwa 1,5 Saisons"), also muss auch die Interpolation ueber
# das Verhaeltnis laufen. Seit Punkt 95 steht jede der zehn Ligen
# ausdruecklich in der Tabelle; die Interpolation greift nur noch, wenn
# jemand eine Liga ergaenzt, ohne ihre Praemie zu nennen.
verfahren = "logarithmisch"

[preisgeld.anteil_kurve]
# Entscheidung A: geometrisch von Platz 3 (65 %) auf den letzten Platz
# (5 %). Punkt 95: Der letzte ist jetzt der vierzigste.
verfahren = "geometrisch"
von_platz = 3
bis_platz = 40

[preisgeld.startgeld]
# Entscheidung A: Sockel unterhalb des Anteils fuer Platz 30.
anteil_siegpraemie = 0.05

[erfahrung.betraege]
# Entscheidung B: ausgewogen. Der Spieler startet laut GDD 1 bei 0 und wird
# anfangs Letzter; ohne Sockel kaeme er nicht in Gang.
grundbetrag_je_session = 0.15
platzierung_nach_tabelle = 1.0
je_ueberholmanoever = 0.01

[erfahrung.wetter.betrag]
# Entscheidung B: ein voller Renntag im Regen zahlt spuerbar ein, reicht
# aber bei weitem nicht fuer die Faehigkeit.
je_km_anteil_sieg_ep = 0.001

[kosten.k0_faktor]
# Entscheidung B: nach Wirkungsbreite. Der Faktor ist die Summe der
# Gewichte einer Faehigkeit aus der Wirkungsmatrix, geteilt durch den
# Mittelwert ueber alle Faehigkeiten. Breit wirkende Faehigkeiten kosten
# mehr, damit Schwerpunkte noetig werden (GDD 9).
verfahren = "wirkungsbreite"

[defekte.reparatur]
# Entscheidung A: Kostenstufe mal Anteil der Siegpraemie. Die Kopplung an
# die Siegpraemie haelt die Kosten ueber alle 20 Ligen im Verhaeltnis.
anteil_siegpraemie_je_stufe = 0.01

[sponsoren.betraege]
# Entscheidung B: zweite Saeule neben dem Preisgeld.
grundbetrag_alle_plaetze = 0.60
praemie_sieg = 1.00
praemie_top3 = 0.50
praemie_top10 = 0.20

# Streuung der Angebote gegeneinander, damit die Auswahl etwas bringt.
streuung = 0.30

[sponsoren.aufteilung]
auto_haupt = 0.40
auto_neben_1 = 0.15
auto_neben_2 = 0.15
anzug = 0.10
helm = 0.10
muetze = 0.10

# --- Punkt 34: Dauerhafte Prozentwirkungen der Ereignisse (GDD 14) --------
[ereignisse.dauerhaft]
# Elf Ereignisse wirken "dauerhaft", meist mit +/-1 %. Bei niedrigen Werten
# waere ein Prozentsatz davon fast nichts - gerechnet wird deshalb wie im
# Zeitmodell aus GDD 2: max(+10, +1 %). Seit dem Startwert 2.500 aus
# Punkt 95 ist beim Spieler von Anfang an das Prozent die groessere Zahl;
# der Mindestschritt traegt jetzt die Werte, die ein Ereignis nach unten
# gedrueckt hat.
# Bei abweichenden Prozentsaetzen skaliert der Mindestschritt mit, damit
# die Ereignisse untereinander im Verhaeltnis bleiben: +2 % ergibt
# mindestens +20, -0,5 % hoechstens -5.
mindestschritt = 10
bezugsanteil = 0.01

# --- Punkt 35: Auswahl des Ereignisses (GDD 14) ---------------------------
[ereignisse.auswahl]
# GDD 14 nennt keine Gewichte; alle 35 sind gleich wahrscheinlich. Innerhalb
# eines Zyklus wird ohne Zuruecklegen gezogen, sonst traefe dieselbe
# Erkaeltung zweimal in vier Tagen.
verfahren = "gleichverteilt"
ohne_zuruecklegen_je_zyklus = true

# --- Punkt 36: Ereignisse nur fuer den Spieler (GDD 14) -------------------
[ereignisse.umfang]
# GDD 14 schreibt "betreffen Spieler und KI gleichermassen". Entschieden am
# 2026-09-17: vorerst nur der Spieler. Begruendung in OFFENE_PUNKTE.md.
gilt_fuer_ki = false

# --- Punkt 20: Ereignisbetraege (GDD 14) ----------------------------------
[ereignisse.betraege]
# Entscheidung B: spuerbar. Ereignisse treten nur 0 bis 2 je Zyklus auf,
# ein einzelnes darf also auffallen. Anteile an Siegpraemie bzw. Sieg-EP.
E4 = 0.10
E7 = 0.25
E14 = 0.15
E9 = 0.15
E16 = 0.15
