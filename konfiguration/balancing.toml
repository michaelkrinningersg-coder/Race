# Rennmanager – zentrale Balancing-Konfiguration
#
# Quelle aller Werte: "Rennmanager – Game Design Dokument (v1.0)".
# Jede Sektion nennt den zugehoerigen GDD-Abschnitt.
#
# Arbeitsregel: Balancing-Werte stehen ausschliesslich hier, nie im Code.
# Fehlt im GDD eine Angabe, steht sie unter [offen] und wird nicht erfunden.

schema_version = 1
gdd_version = "1.0"

# ---------------------------------------------------------------------------
# GDD 1 / 9 – Werteskala und Kalibrierung
# ---------------------------------------------------------------------------
[skala]
minimum = 0
maximum = 100_000
# Referenzwert, an dem die Kalibrierfunktion 180 km/h liefert
referenz = 98_000

[kalibrierung]
# v(S) = basis_kmh + spanne_kmh * sqrt(S / referenz)
basis_kmh = 55.0
spanne_kmh = 125.0
# Kontrollpunkte aus GDD 9
v_bei_0_kmh = 55.0
v_bei_referenz_kmh = 180.0
v_bei_maximum_kmh = 181.3
# Hoechstgeschwindigkeit auf Geraden, getrennt skaliert (GDD 4 und 9)
endgeschwindigkeit_max_kmh = 400.0

# ---------------------------------------------------------------------------
# GDD 9 / 12 – Ligen
# ---------------------------------------------------------------------------
[ligen]
anzahl = 20
autos_je_liga = 30
# Tempo des Besten je Liga: Liga 20 = 60,0 km/h, je Liga aufwaerts +6,32 km/h
bester_liga20_kmh = 60.0
zuwachs_je_liga_kmh = 6.32
# Der Letzte einer Liga ist 0,3 km/h langsamer als der Beste der Liga darunter
ueberlappung_kmh = 0.3
# Ausnahme Liga 20: Der Letzte faehrt 56,0 km/h
letzter_liga20_kmh = 56.0
startliga = 20

# Kontrollwerte aus der Tabelle in GDD 9 (Pruefwerte fuer die Kalibrierung)
[[ligen.kontrolle]]
liga = 20
bester_kmh = 60.0
letzter_kmh = 56.0
s_bester = 157
s_letzter = 6

[[ligen.kontrolle]]
liga = 15
bester_kmh = 91.6
letzter_kmh = 85.0
s_bester = 8_400
s_letzter = 5_640

[[ligen.kontrolle]]
liga = 10
bester_kmh = 123.2
letzter_kmh = 116.6
s_bester = 29_170
s_letzter = 23_780

[[ligen.kontrolle]]
liga = 5
bester_kmh = 154.8
letzter_kmh = 148.2
s_bester = 62_470
s_letzter = 54_460

[[ligen.kontrolle]]
liga = 1
bester_kmh = 180.1
letzter_kmh = 173.5
s_bester = 98_130
s_letzter = 88_010

# Ligennamen: Platin, Gold, Silber, Bronze mit je 5 Stufen (GDD 12)
[[ligen.namen]]
stufe = "Platin"
von_liga = 1
bis_liga = 5

[[ligen.namen]]
stufe = "Gold"
von_liga = 6
bis_liga = 10

[[ligen.namen]]
stufe = "Silber"
von_liga = 11
bis_liga = 15

[[ligen.namen]]
stufe = "Bronze"
von_liga = 16
bis_liga = 20

# ---------------------------------------------------------------------------
# GDD 2 – Kalender und Zeitmodell
# ---------------------------------------------------------------------------
[kalender]
# Erstes Rennen am ersten Sonntag ab dem 01.03.
saisonstart_monat = 3
saisonstart_tag = 1
rennen_je_saison = 20
abstand_tage = 14
nutzbare_tage_je_zyklus = 10
# Qualifying Samstag, Rennen Sonntag
qualifying_wochentag = 5   # 0 = Montag
rennen_wochentag = 6
# Vorsaison ab 01.01., Nachsaison bis 31.12.; Saisonwechsel 31.12./01.01.
vorsaison_start_monat = 1
vorsaison_start_tag = 1
nachsaison_ende_monat = 12
nachsaison_ende_tag = 31
# Zwei parallele Plaetze je Tag: Fahrer (Training) und Werkstatt (Entwicklung)
plaetze_je_tag = ["fahrer", "werkstatt"]

[zeitmodell]
# Ein zugewiesener Tag hebt den Wert um max(schritt_absolut, anteil * S)
schritt_absolut = 10
schritt_anteil = 0.01
# Schrittweite fuer Kaeufe (GDD 9)
kaufschritt = 10

# ---------------------------------------------------------------------------
# GDD 3 – Streckenmodell
# ---------------------------------------------------------------------------
[strecke]
# Linie auf festen Punktabstand neu abtasten
abtastabstand_m = 5.0
# Segmenttyp aus dem Kruemmungsradius
enge_kurve_radius_max_m = 60.0
gerade_radius_min_m = 300.0
# Nur Geraden ab dieser Laenge sind Ueberholzonen
ueberholzone_mindestlaenge_m = 100.0
sektoren = 4
quelle = "TUMFTM/racetrack-database"
lizenz = "LGPL-3.0"
# Die CSV-Dateien liegen unter daten/strecken/ und werden mitgepackt.
verzeichnis = "daten/strecken"
# Die Autos fahren auf der Ideallinie (GDD 3).
linie = "ideallinie"
# Segmenttypen rein nach Radius, ohne Mindestlaenge - das GDD nennt keine.
mindestsegmentlaenge_m = 0.0

