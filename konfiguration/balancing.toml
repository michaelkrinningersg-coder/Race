# ---------------------------------------------------------------------------
# GDD 8 – Bereiche der Wirkungsmatrix
# ---------------------------------------------------------------------------
[wirkungsmatrix]
bereiche = ["ek", "k", "g", "bplus", "bminus", "st", "du", "fe", "ve", "er", "q"]
gewicht_min = 0
gewicht_max = 3
# Innerhalb eines Bereichs werden die Gewichte normiert
normieren_je_bereich = true

[wirkungsmatrix.bezeichnung]
ek = "Enge Kurve"
k = "Kurve"
g = "Gerade"
bplus = "Beschleunigen"
bminus = "Bremsen"
st = "Start"
du = "Duell"
fe = "Fehler/Streuung"
ve = "Verschleiss/Defekte"
er = "Ermuedung"
q = "Qualifying"

# ---------------------------------------------------------------------------
# GDD 9 – Kosten
# ---------------------------------------------------------------------------
[kosten]
# K(S) = k0 * (1 + S / teiler) ^ exponent, je Kaufschritt von +10
teiler = 1000.0
exponent = 0.6
k0_geld = 50.0
k0_erfahrung = 5.0
# Wer Zeit einsetzt, gibt auch etwas Erfahrung dazu: Ein belegter Tag ist
# Arbeit am Auto und am Fahrer, und die kostet Koepfe. Die Zeit selbst
# bleibt bei einem Tag - sie skaliert nicht -, die Erfahrung waechst mit
# jedem Kauf ueber dieselbe Kurve wie Geld und Erfahrung. Faehigkeiten,
# die ohnehin schon Erfahrung kosten, zahlen nicht doppelt.
k0_erfahrung_zeit = 2.0
# Nur Einzelkauf, kein Mehrfachkauf
mehrfachkauf = false
# Punkt 95: Mit dem Startwert 12.000 kostet ein belegter Tag nicht mehr
# 50 EUR, sondern rund 2.800 - der Tageszuwachs ist max(10, 1 %), also
# +120 statt +10, und jeder Schritt kostet mehr. Der Faktor ist 56.
# Mitskaliert, damit das Startkapital dieselben rund zwanzig Tage kauft
# wie bisher: 1.000 x 56 = 56.000, abgerundet auf 55.000.
startkapital_euro = 55_000
# Punkt 95: Womit die vier eigenen Autos in eine neue Karriere gehen.
# GDD 1 nennt 0, und das stimmte, solange die unterste Liga bei S = 157
# begann. Seit dem Ligenumbau beginnt sie bei 20.000: Ein Auto mit 0
# faehrt in Zandvoort 277,8 s je Runde gegen 138,6 s des Ligabesten -
# ueber die Renndistanz 69 Runden Rueckstand, und herauskaufen liesse es
# sich nicht (350.000 EUR je Auto gegen rund 240.000 EUR Saisoneinnahmen).
# Der Spieler startet deshalb auf demselben Boden wie die KI: auf
# ``mindeststaerke``. Er faehrt damit 154,7 s - hinterher, aber im selben
# Rennen.
startwert_spieler = 12_000
# Erfahrungssockel zum Start (Entscheidung des Auftraggebers). Seit ein
# belegter Tag auch Erfahrung kostet, stuende der Spieler am 1. Januar
# sonst mit null da: Der erste Zeitkauf kostet 2 EP, Erfahrung gibt es
# aber erst fuers Fahren. Die ersten zehn Tage einer Karriere waeren
# damit tot. Zwanzig reichen fuer einen Handvoll erster Schritte; ab dem
# ersten Rennen spielt der Sockel keine Rolle mehr (Platz 12 bringt 243,
# ein Sieg 775 EP).
# Derselbe Faktor 56 wie beim Startkapital: Ein Tag kostet bei S = 12.000
# rund 112 EP statt 2. Zwanzig EP truegen nicht einmal mehr den ersten
# Trainings- **und** den ersten Werkstatttag, wofuer der Sockel gedacht
# ist. 20 x 56 = 1.120, abgerundet auf 1.100.
startkapital_erfahrung = 1_100

