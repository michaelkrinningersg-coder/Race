# ---------------------------------------------------------------------------
# GDD 4 – Rennsimulation
# ---------------------------------------------------------------------------
[rennen]
# Punkt 101: Ein Feld, 50 Autos - 25 Hersteller zu je zwei.
autos = 50
distanz_km = 290
# Rundenzahl = Distanz / Streckenlaenge, aufgerundet
rundenzahl_aufrunden = true

[start]
# Jedes Auto steht 5 m hinter dem Vordermann
abstand_m = 5.0
reaktionszeit_min_ms = 100
reaktionszeit_max_ms = 300

[ueberholen]
# Nur auf Geraden ab ueberholzone_mindestlaenge_m, nie in Kurven
nur_in_ueberholzonen = true
max_abstand_s = 0.05
min_tempovorteil_kmh = 2.0
# Bei Duellen werden die Punkte leicht seitlich versetzt (keine Kollisionsphysik)
seitlicher_versatz = true

[unfaelle]
# Sehr selten und nur bei geringem Abstand
max_abstand_m = 30.0
# Je Rennen wird eine Obergrenze von 0 bis 5 Ausfaellen gewuerfelt
ausfaelle_min = 0
ausfaelle_max = 5

[zeitraffer]
stufen = [1, 2, 5, 10, 20, 50, 100]
sofortergebnis = true
# Wiedergabe: Takt der Anzeige. 33 ms sind rund 30 Bilder je Sekunde, das
# laeuft fluessig, ohne unnoetig Rechenzeit zu kosten.
takt_ms = 33
# Punkt 62: Rangliste und Zeitenmonitor werden seltener neu gefuellt als
# die Karte. Bei jedem Bild sprangen die Zeiten so schnell um, dass sie
# nicht zu lesen waren; 200 ms stehen ruhig genug. Einstellbar von 10 ms
# bis 5 Sekunden - die Karte laeuft unabhaengig davon weiter fluessig.
anzeige_takt_ms = 200
anzeige_takt_min_ms = 10
anzeige_takt_max_ms = 5000
# Nach dem Berechnen laeuft das Rennen von selbst los.
automatisch_starten = true
# Zeitrafferstufe, mit der ein Rennen startet (Entscheidung des
# Auftraggebers). Vorher suchte die Oberflaeche die kleinste Stufe, mit
# der das Rennen in rund 210 Sekunden durchlief - auf langen Strecken
# also 20x oder 50x. Jetzt faengt jedes Rennen in Echtzeit an; wer es
# schneller will, stellt die Stufe im Rennen um.
#
# Der Wert muss in ``stufen`` oben vorkommen.
start_stufe = 1

[simulation]
# Schrittweite der Rennsimulation. 50 ms sind fein genug: Bei 400 km/h
# faehrt ein Auto 5,6 m je Schritt, der Abstand zum Vordermann wird aber
# aus den Positionen gerechnet und ist damit genauer als die Schrittweite.
zeitschritt_ms = 50
# Nur jede so viele Millisekunden wird eine Position festgehalten. Die
# Anzeige liest daraus und rechnet dazwischen linear (GDD 15).
bildschritt_ms = 200

[zeitmessung]
# Intern ganze Millisekunden, Linienueberfahrten interpoliert
einheit = "ms"
format_unter_stunde = "m:ss.mmm"
format_ab_stunde = "h:mm:ss.mmm"
# Rueckstand in der Seitenleiste
rueckstand_format_unter_60s = "s.mmm"
rueckstand_format_ab_60s = "m:ss.mmm"
ueberrundet_text = "+{runden} Rd."
# Gleichstand auf die Millisekunde: hoeherer Durchschnitt der Basiseigenschaften,
# sonst entscheidet das Los
gleichstand_reihenfolge = ["basiseigenschaften_mittelwert", "los"]

[zeitenmonitor]
spalten = ["letzte_runde", "beste_runde", "sektor_1", "sektor_2", "sektor_3", "sektor_4"]

# ---------------------------------------------------------------------------
# GDD 4 / 6 – Streckenkenntnis (automatisch)
# ---------------------------------------------------------------------------
[streckenkenntnis]
max_bonus = 0.015          # bis +1,5 % Tempo
volle_kenntnis_runden = 1000

# --- Punkt 101: Der Stand steht fest --------------------------------------
[streckenkenntnis.anfang]
# Seit Punkt 101 waechst die Streckenkenntnis nicht mehr - niemand
# entwickelt sich. Der Stand wird einmal bei der Welterzeugung je Fahrer
# und Strecke gesetzt und bleibt dann, wie er ist.
#
# Die Streuung ist bewusst breit: Sie steht fuer alles, was ein Fahrer
# vor Karrierebeginn auf dieser Strecke gefahren ist.
anteil = 0.35              # im Mittel 35 % der vollen Kenntnis
streuung = 0.80            # +/- 80 % darum

# ---------------------------------------------------------------------------
# GDD 4 – Qualifying
# ---------------------------------------------------------------------------
[qualifying]
aufwaermrunden = 1
gezeitete_runden = 1
# Die Autos fahren zwar allein (GDD 4), starten aber ueberlappend: jedes
# rueckt eine halbe Runde nach dem vorigen los. Ohne Ueberlappung dauert
# eine Session 50 x 2 Runden; in Spa waeren das Stunden, in denen sich
# das Wetter zwangslaeufig mehrfach dreht und die Startreihenfolge mehr
# entscheidet als die Fahrleistung.
#
# Die halbe Runde ist die Vorgabe des Auftraggebers, in seinen Worten:
# Jedes Auto soll seine gezeitete Runde rund 25 Prozent seiner Zeit auf
# der Strecke beginnen, bevor das vorige fertig ist - und so weiter
# durch das ganze Feld. Ein Auto ist zwei Runden auf der Strecke, ein
# Viertel davon ist eine halbe Runde.
#
# Gemessen in Sakhir: 199,2 s auf der Strecke, der Zweite beginnt seine
# gezeitete Runde 50,1 s bevor der Erste fertig ist - 25,2 Prozent. Es
# sind dann bis zu fuenf Autos gleichzeitig unterwegs, davon bis zu drei
# auf gezeiteter Runde; vorher war immer nur eines gezeitet unterwegs.
# Die Session dauert 42 statt 101 Minuten.
#
# Auf die Zeiten wirkt das nicht: Pole, letzte Zeit, Spanne und
# Gummistand sind in Sakhir, Monza und Zandvoort auf die Millisekunde
# dieselben. Nur wenn das Wetter waehrend der Session dreht, trifft ein
# Auto den Wechsel an anderer Stelle - gemessen ueber zwoelf Sessions in
# Spa blieb die Polezeit zehnmal gleich, zweimal wich sie um 0,030 s und
# 0,588 s ab.
abstand_runden = 0.5
# Punkt 93 (A7 und A8): Wie lange ein frisches Ereignis in der
# Zeitentafel nachleuchtet - der Verdraengungshinweis und die neue Pole.
# Gemessen in **Sessionzeit**, nicht in Bildschirmzeit: Bei 50-fachem
# Zeitraffer waere eine Sekunde Bildschirmzeit fast eine Minute Session,
# und der Hinweis staende dauernd da. Acht Sekunden sind rund ein
# Zehntel einer Qualirunde.
hervorhebung_ms = 8000

[qualifying.wetter]
# Selbst mit ueberlappendem Start dauert eine Session in Spa fast zwei
# Stunden. Wuerde das Wetter darin wie im Rennen bis zu dreimal wechseln,
# entschiede vor allem die Startreihenfolge - gemessen landeten die fuenf
# staerksten Autos im Schnitt auf Platz 8,0 von 30.
#
# Zwei Begrenzungen bringen das zurecht, beide nur fuers Qualifying:
#   Fenster fuer die Wechselzeitpunkte ab Sessionbeginn  8,0 -> 5,9
#   dazu hoechstens ein Wechsel                          5,9 -> 3,9
# Ohne jeden Wechsel waeren es 3,3; ganz ohne Wetterwirkung soll das
# Qualifying aber nicht sein.
fenster_minuten = 15
wechsel_max = 1
# Startreihenfolge: umgekehrter Meisterschaftsstand
reihenfolge = "meisterschaft_umgekehrt"
# Im ersten Rennen der Saison aufsteigend nach durchschnittlicher Qualifying-Faehigkeit
reihenfolge_erstes_rennen = "qualifying_faehigkeit_aufsteigend"
live_einsortierung = true

# ---------------------------------------------------------------------------
# GDD 7 – Wetter
# ---------------------------------------------------------------------------
[wetter]
# Kette: Starkregen <-> Regen <-> Wechselhaft <-> Trocken <-> Heiss
kette = ["starkregen", "regen", "wechselhaft", "trocken", "heiss"]
wechsel_min = 0
wechsel_max = 3
# Ein Wechsel geht immer nur um eine Stufe
wechsel_schrittweite = 1
# Qualifying und Rennen werden getrennt gewuerfelt
getrennt_je_session = true

[wetter.zustand.trocken]
grip = 1.00
fehlerquote = 1.0
reifenverschleiss = 1.0

[wetter.zustand.heiss]
grip = 0.97
fehlerquote = 1.2
reifenverschleiss = 1.4

[wetter.zustand.wechselhaft]
grip_min = 0.90
grip_max = 1.00
fehlerquote = 1.4
reifenverschleiss = 1.1
# Grip schwankt je Sektor
grip_je_sektor = true

[wetter.zustand.regen]
grip = 0.85
fehlerquote = 1.8
reifenverschleiss = 0.8

[wetter.zustand.starkregen]
grip = 0.72
fehlerquote = 2.5
