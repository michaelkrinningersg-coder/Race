# ---------------------------------------------------------------------------
# GDD 2 – Kalender und Zeitmodell
# ---------------------------------------------------------------------------
[kalender]
# Jahr der ersten Saison. Danach zaehlt jeder Saisonwechsel eines hoch;
# die Karriere ist endlos (GDD 13).
startjahr = 2026
# Erstes Rennen am ersten Sonntag ab dem 01.03.
saisonstart_monat = 3
saisonstart_tag = 1
rennen_je_saison = 20
abstand_tage = 14
nutzbare_tage_je_zyklus = 10
# Qualifying Samstag, Rennen Sonntag
qualifying_wochentag = 5   # 0 = Montag
rennen_wochentag = 6
# Vorsaison ab 01.01., Nachsaison bis 31.12.; Saisonwechsel 31.12./01.01.
vorsaison_start_monat = 1
vorsaison_start_tag = 1
nachsaison_ende_monat = 12
nachsaison_ende_tag = 31
# Zwei parallele Plaetze je Tag: Fahrer (Training) und Werkstatt (Entwicklung)
plaetze_je_tag = ["fahrer", "werkstatt"]

[zeitmodell]
# Ein zugewiesener Tag hebt den Wert um max(schritt_absolut, anteil * S)
schritt_absolut = 10
schritt_anteil = 0.01
# Schrittweite fuer Kaeufe (GDD 9)
kaufschritt = 10

