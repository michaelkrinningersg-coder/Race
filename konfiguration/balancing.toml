# ---------------------------------------------------------------------------
# GDD 4 – Reifen (nur Verschleiss, Boxenstopps spaeter)
# ---------------------------------------------------------------------------
[reifen]
verschleiss_aktiv = true
boxenstopps = false
kraftstoff = false
# Verschleiss senkt das Tempo und erhoeht die Fehlerquote
wirkt_auf = ["tempo", "fehlerquote"]

# ---------------------------------------------------------------------------
# GDD 15 – Technik
# ---------------------------------------------------------------------------
[technik]
spielstand_format = "sqlite"
konfigurationsformat = "toml"
debug_ansicht = true
massensimulation = true
seed_eingabe = true

# ---------------------------------------------------------------------------
# Im GDD nicht festgelegt – bewusst leer, bis entschieden
# ---------------------------------------------------------------------------
[offen]
# Jeder Eintrag beschreibt eine Luecke im GDD. Der Code darf sie nicht selbst
# fuellen; die Konfiguration meldet sie beim Laden als Hinweis.
