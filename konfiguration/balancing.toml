s = 62_470
naechster_schritt_euro = 600
summe_ab_0_euro = 2_400_000

[[kosten.kontrolle]]
bezeichnung = "Bester Liga 1"
s = 98_130
naechster_schritt_euro = 790
summe_ab_0_euro = 4_900_000

# ---------------------------------------------------------------------------
# GDD 10 – Einnahmen
# ---------------------------------------------------------------------------
[preisgeld]
# Punkt 95: Zehn Ligen, zehn feste Siegpraemien - interpoliert wird nichts
# mehr. Die Kurve laesst sich nicht aus GDD 10 ableiten: Dort beginnt die
# unterste Liga bei S = 157 und bekommt 4.000 EUR, die neue unterste
# beginnt bei S = 20.000 und ist damit etwa so stark wie die alte Liga 10
# (370.000 EUR). Folgte das Preisgeld der Staerke, laege die Spanne vom
# Anfaenger zum Weltmeister bei 1,5 - eine Karriere ohne Aufstiegslohn.
#
# Verankert ist sie deshalb neu: Liga 1 bleibt bei 1.300.000 EUR wie im
# GDD, Liga 10 steht bei 60.000 EUR, dazwischen geometrisch mit rund 1,41
# je Liga. Die 60.000 stammen aus dem GDD-Ziel "Aufstieg in etwa 1,5
# Saisons": Ein Ligaschritt kostet in Liga 10 nach der Kostenkurve rund
# 365.000 EUR je Auto, bei vier Autos 1,46 Mio. ueber 30 Rennen; ein
# Mittelfeldteam holt je Rennen etwa 0,8 Siegpraemien.
[preisgeld.siegpraemie_euro]
10 = 60_000
9 = 85_000
8 = 120_000
7 = 170_000
6 = 235_000
5 = 330_000
4 = 470_000
3 = 660_000
2 = 920_000
1 = 1_300_000

[preisgeld.anteil]
# Anteil an der Siegpraemie je Platz; im GDD sind nur diese Stuetzstellen
# genannt. Punkt 95: Das Feld hat 40 Autos, die Kurve endet also auf
# Platz 40 statt 30 - sonst gingen zehn Autos leer aus.
1 = 1.00
2 = 0.80
3 = 0.65
40 = 0.05

[erfahrung]
# EP-Betraege = Preisgeld / 10
teiler_gegenueber_preisgeld = 10
# Grundbetrag je Session, Platzierungsbonus und Bonus je Ueberholmanoever
quellen = ["grundbetrag_session", "platzierungsbonus", "ueberholbonus"]

[erfahrung.wetter]
# Eigener Topf je Wetter, nur fuer die passende Wetterfaehigkeit nutzbar
eigener_topf_je_wetter = true
quellen = ["je_km_im_wetter", "platzierungsbonus"]

[finanzen]
laufende_kosten = false
schulden = false
bankrott = false
# KI-Teambudgets sind vorerst nur Anzeige
ki_budget_wirksam = false
# Punkt 72: Das Teambudget des Spielers war bisher ebenfalls nur Anzeige.
# Jetzt zahlt es sich in Monatsraten aus und fuellt das Konto - am Ersten
# jedes Monats eine Rate, zwoelf im Jahr, auch in Vor- und Nachsaison.
budget_raten_je_jahr = 12

[sponsoren]
plaetze = ["anzug", "helm", "muetze", "auto_haupt", "auto_neben_1", "auto_neben_2"]
angebote_je_platz_min = 3
angebote_je_platz_max = 10
angebot_gueltig_wochen_min = 3
angebot_gueltig_wochen_max = 10
laufzeit_rennen_min = 3
laufzeit_rennen_max = 25
saisonuebergreifend = true
verguetung = ["grundbetrag_je_rennen", "praemie_sieg", "praemie_top3", "praemie_top10"]
skaliert_mit_liga = true

# Anzeigenamen der sechs Plaetze; die Oberflaeche ist deutsch.
[sponsoren.bezeichnung]
anzug = "Anzug"
helm = "Helm"
muetze = "Muetze"
auto_haupt = "Auto, Hauptplatz"
auto_neben_1 = "Auto, Nebenplatz 1"
auto_neben_2 = "Auto, Nebenplatz 2"

# ---------------------------------------------------------------------------
# GDD 11 – Zufallssystem
# ---------------------------------------------------------------------------
[zufall.tagesform]
# Ein Faktor auf alle Fahrerwerte, vor Qualifying und erneut vor Rennen
sigma = 0.03
grenze = 0.08

[zufall.eigenschaft]
# Jeder einzelne Wert, vor Qualifying und erneut vor Rennen
sigma = 0.02
grenze = 0.05

[zufall.rundenform]
# Punkt 95: Nicht mehr je Runde, sondern **je Sektor**. Vier gleich lange
# Sektoren mitteln sich zu 0,25 % Rundenstreuung - nah an den 0,3 %, die
# GDD 11 fuer die Runde nennt, aber innerhalb der Runde schwankt es
# sichtbar. Verkleinert durch D12 Konstanz.
sigma = 0.005
je_sektor = true
verkleinert_durch = "D12"

# ---------------------------------------------------------------------------
# GDD 12 – Teams, Hersteller, KI
# ---------------------------------------------------------------------------
[teams]
# Punkt 95: 10 Ligen zu je 40 Autos sind 400 Autos. Vier Autos je Team sind
# aus GDD 12 gesetzt und bleiben, also sinkt die Teamzahl von 150 auf 100.
anzahl = 100
autos_je_team = 4
# Teamnamen aus zwei Teilen (siehe namen.toml). Das GDD nennt fuer Teams
# nur die Felder, nicht die Namensbildung; Begruendung in OFFENE_PUNKTE.md.
namensbildung = "zwei_teile"
# Budget je Team, nur Anzeige (GDD 10). Es folgt der Siegpraemie der
# Ligen, in denen die vier Autos des Teams fahren.
budget_in_siegpraemien = 8.0
budget_streuung = 0.35
# Die 4 Autos eines Teams koennen in verschiedenen Ligen fahren
ligen_gemischt = true
# Der Spieler faehrt in einem Team mit 3 KI-Fahrern
ki_teamkollegen = 3
felder = ["name", "herkunftsland", "hersteller", "budget", "teamfarbe"]

[namen]
# Fahrer- und Teamnamen stehen ausgelagert, damit sie austauschbar sind.
datei = "namen.toml"

[hersteller]
anzahl = 20
# Namen stehen in konfiguration/hersteller.toml (austauschbar, Markenrecht)
datei = "hersteller.toml"
leistungsbonus = false

[ki]
# Einzelwerte streuen um den Mittelwert des Autos (GDD 12: +/-25 %)
profil_streuung = 0.25
# Entscheidung zu Punkt 37: zusaetzlich ein Profil ueber die elf
# Wirkungsbereiche. Ohne das mittelt sich die Einzelwert-Streuung im
# Bereichsmittel weg - gemessen blieben von +/-25 % nur 20 % Spanne
# zwischen dem staerksten und dem schwaechsten Bereich eines Fahrers.
# Erst dieser Faktor macht Spezialisten, wie GDD 12 sie nennt.
bereichs_streuung = 0.30
# Die Wetterfaehigkeiten stehen neben der Matrix und streuen fuer sich.
wetter_streuung = 0.45
# Punkt 35: Die KI entwickelt sich jetzt - jeder Fahrer nach seinem
# eigenen Talent (siehe [talent]). Damit lernt sie auch Strecken dazu.
entwicklung = true

[fahrernamen]
geschlecht = "maennlich"
regionen = ["Europa", "Nordamerika"]
an_echte_fahrer_angelehnt = false
felder = ["vorname", "nachname", "herkunftsland", "geburtsdatum", "team", "hersteller"]
# Punkt 35: Die KI altert jetzt. Das GDD nannte ein Geburtsdatum "vorerst
# ohne Altern"; der Auftraggeber hat Ruecktritt und Newgens entschieden.
altern = true
# Geburtsjahre der erzeugten Fahrer. Das GDD nennt ein Geburtsdatum
# "vorerst ohne Altern", aber keine Spanne; gewaehlt ist ein uebliches
# Rennfahreralter zum Saisonstart.
alter_min = 18
alter_max = 42
# Anteil nordamerikanischer Fahrer. GDD 12 nennt beide Regionen, ohne
# Gewichtung; gewaehlt nach der Zahl der Laender (3 von 32).
anteil_nordamerika = 0.1

# ---------------------------------------------------------------------------
# Punkt 35 – Ruecktritt, Newgens und die Entwicklung der KI
# ---------------------------------------------------------------------------
[generationen]
# Ruecktrittsalter, je Fahrer einmal gestreut. Der Wert haengt am Seed und
# an der Fahrernummer, steht also fest, ohne gespeichert zu werden.
ruecktritt_min = 34
ruecktritt_max = 42
# Hoechstens so viele Ruecktritte je Winter. Die Startwelt wuerfelt Alter
# von 18 bis 42, damit waeren im ersten Winter 152 Fahrer ueber ihrer
# Grenze - ein Viertel des Feldes auf einmal. Die Grenze verteilt die
# Welle auf mehrere Jahre; wer nicht drankommt, tritt im naechsten zurueck.
#
# Mehr als 30 gehen, weil die Newgens von unten aufsteigen duerfen: erst
# Liga 20, und wenn es mehr sind, als dort Platz haben, auch Liga 19. Bei
# einer Obergrenze von 30 blieben gemessen dauerhaft rund 60 Fahrer im
# Rueckstau, weil die natuerliche Rate darueber liegt (600 Fahrer bei
# rund 18 Jahren Laufbahn sind etwa 33 im Jahr).
ruecktritte_je_saison_max = 45
# Alter der Newgens beim Einstieg in Liga 20.
newgen_alter_min = 18
newgen_alter_max = 22

# Faktor am Ende der Laufbahn, gemessen am Gipfel (1,0): Wer sein
# Ruecktrittsalter erreicht, steht bei 85 % dessen, was er konnte.
faktor_bei_ruecktritt = 0.85

# ---------------------------------------------------------------------------
# Punkt 35 - Das Talent eines Fahrers
# ---------------------------------------------------------------------------
# Bis hierher fuhr jeder Fahrer dieselbe Alterskurve. Damit entschied
# innerhalb einer Liga allein das Alter, wer vorne stand - die Ligen
# wurden Altersklassen statt Leistungsklassen. Ein Talent je Fahrer loest
# das: Jeder hat sein eigenes Potential, sein eigenes Tempo und sein
# eigenes Gipfelalter.
#
# Alles aus Seed und Fahrernummer abgeleitet, nichts gespeichert - damit
# steht es von Anfang an fest und ueberlebt jeden Spielstand (GDD 15).
[talent]
# Entscheidung des Auftraggebers zur Ligastaerke: Seit die Entwicklung am
# Talent haengt, wird **nicht mehr normiert**. Die Kontrolltabelle in
# [ligen] beschreibt damit nur noch den Weltstart; danach sind die Ligen
# das, was die Talentverteilung aus ihnen macht. Gemessen ueber dreissig
# Saisons, Ist gegen Soll: L1 84 %, L5 59 %, L10 88 %, L15 149 %,
# L20 5182 % - Liga 20 ist der Talentpool der Welt, kein schwaches Feld.
# Die Kalibrierung selbst bleibt exakt: zieltempo(98000) = 180,00 km/h
# haengt an den Konstanten, nicht an der Welt.
#
# Band "Extrem" (Entscheidung des Auftraggebers): grosse Unterschiede
# zwischen den Laufbahnen, bis hin zum Fahrer, der mit 24 fertig ist, und
# dem, der mit 36 noch aufsteigt.
tempo_min = 0.3
tempo_max = 2.0
gipfel_min = 23
gipfel_max = 33
abbau_min = 28
abbau_max = 38
# Wie nah ein Fahrer seinem Potential zu seinem Gipfelalter gekommen ist.
# Daraus wird das jaehrliche Schrittmass abgeleitet: Wer frueh seinen
# Gipfel hat, waechst schneller. Deshalb braucht es keine eigene
# Wachstumskonstante - Gipfelalter und Tempo sagen alles.
reife_am_gipfel = 0.90
# Was ein Achtzehnjaehriger schon von seinem Potential mitbringt. Ohne
# das stuende ein Einsteiger bei null und wuerde jede Runde ueberrundet.
anfang_anteil = 0.12
# Punkt 95: Der Boden der Welt. Die erreichte Staerke eines Fahrers ist
# sein Gipfel mal Reifegrad mal Zielfaktor - ein junger Fahrer mit
# schwachem Potential landete damit bei 2.500, waehrend die unterste Liga
# bei 17.700 beginnt. Gemessen fuhr er in Zandvoort 205 s gegen 139 s des
# Ligabesten. Der Boden faengt genau diesen Schwanz ab: Gemessen stehen
# 17 von 396 KI-Fahrern darauf, die Ligen 1 bis 9 bleiben unberuehrt, und
# Liga 10 reicht von 12.000 bis 17.662 statt von 2.559 bis 17.662.
# Er liegt unter dem Korridorboden aus [ligen] - der beschreibt die
# **Potentiale**, dieser Wert das erreichte Koennen.
mindeststaerke = 12_000

# ---------------------------------------------------------------------------
# Punkt 39 - Reifenmischungen
# ---------------------------------------------------------------------------
# Fuenf Mischungen: drei fuer trocken, zwei fuer nass. Jede hat einen
# Zeitgewinn und einen Verschleissfaktor - wer schneller faehrt, haelt
# kuerzer. Zwei verschiedene Mischungen sind Pflicht, deshalb kostet
# jedes Rennen mindestens einen Stopp.
#
# **Der Verschleiss haengt jetzt an der Strecke, nicht an der
# Renndistanz** (Entscheidung des Auftraggebers). Vorher war er durch die
# Renndistanz geteilt, ein Satz hielt also per Konstruktion genau ein
# Rennen. Jetzt haelt ein Stint eine feste Strecke, und wie viele Stopps
# noetig sind, ergibt sich daraus: Liga 1 faehrt 293 km, Liga 20 nur 100 -
# derselbe Reifen bedeutet dort einen Stopp und hier drei.
[reifen.mischungen]
# Wie weit ein Stint mit der mittleren Mischung traegt, beim Referenzauto
# auf einer durchschnittlichen Strecke. Daraus folgt die Stoppzahl.
#
# Gegen das Ziel des Auftraggebers kalibriert - 1 bis 3 Stopps: Ueber
# alle 20 Ligen, 20 Strecken und 3 Trockenmischungen liegen 1191 von 1200
# Kombinationen bei 0 bis 3 Stopps. Die Nullen faengt die
# Zwei-Mischungs-Pflicht ab, die neun Vierer sind reine Weich-Strategien
# auf den haertesten Strecken - die waehlt niemand freiwillig.
stint_basis_m = 165_000
# Wie stark eine unpassende Mischung bestraft wird, je Einheit Abstand
# zwischen der Naesse der Lage und der, fuer die der Reifen gebaut ist.
naesse_strafe_tempo = 0.12
# Gemildert von 2,5: Gemessen erzwang der alte Wert bei Regen bei allen
# 30 Autos drei Stopps, weil selbst der passende Reifen noch danebenlag.
naesse_strafe_verschleiss = 1.6
# Wie nass eine Wetterlage ist, 0 trocken bis 1 voll unter Wasser. Steht
# hier statt bei [wetter], weil es eine Reifensache ist.
naesse_je_lage = { trocken = 0.0, heiss = 0.0, wechselhaft = 0.35, regen = 0.7, starkregen = 1.0 }

[[reifen.mischungen.liste]]
schluessel = "weich"
name = "Weich"
# Punkt 89: Die drei trockenen Mischungen halten durchgehend rund ein
# Sechstel laenger als vorher (1,27 / 0,88 / 0,64 -> 1,05 / 0,73 /
# 0,53). Die Verhaeltnisse untereinander bleiben, nur die Stints
# werden laenger - noetig, seit ein Stint schon bei 40 Prozent
# Restprofil endet statt bei 30. Der Gummi-Auftrag aus Punkt 88
# haengt am selben Wert, bezieht sich aber auf Mittel und bleibt
# deshalb, wo er war (1,44 / 1,00 / 0,73).
kuerzel = "W"
farbe = "#D7191C"
tempo = 1.020          # rund 1,8 s je Runde schneller als hart
verschleiss = 1.05
naesse = 0.0

[[reifen.mischungen.liste]]
schluessel = "mittel"
name = "Mittel"
kuerzel = "M"
farbe = "#E8B93B"
tempo = 1.010
verschleiss = 0.73
naesse = 0.0

[[reifen.mischungen.liste]]
schluessel = "hart"
name = "Hart"
kuerzel = "H"
farbe = "#F2F0EB"
tempo = 1.000
verschleiss = 0.53
naesse = 0.0

[[reifen.mischungen.liste]]
schluessel = "intermediate"
name = "Intermediate"
kuerzel = "I"
farbe = "#2E9E4F"
tempo = 0.985
verschleiss = 1.10
# Auf "wechselhaft" (0,35) gebaut, nicht auf die Mitte der Skala - sonst
# passt zu keiner wirklichen Wetterlage ein Reifen genau.
naesse = 0.4

[[reifen.mischungen.liste]]
schluessel = "regen"
name = "Regen"
kuerzel = "R"
farbe = "#2B6CB0"
tempo = 0.965
verschleiss = 0.90
# Zwischen "regen" (0,7) und "starkregen" (1,0) - er deckt beide ab.
naesse = 0.85

# ---------------------------------------------------------------------------
# Punkt 39 - Boxenstopps
# ---------------------------------------------------------------------------
# Die Streckendateien enthalten keine Boxengasse. Der Auftraggeber hat
# entschieden, sie aus der Geometrie abzuleiten: von der Geraden vor
# Start/Ziel durch die Kurvenkombination danach bis zur naechsten
# Geraden. Dort gilt das Limit; Bremsen davor und Beschleunigen danach
# rechnet dasselbe Geschwindigkeitsprofil wie sonst.
[boxenstopp]
limit_kmh = 80
# Das Limit steht nicht ueberall gleich: Je tiefer die Liga, desto
# strenger die Boxengasse. So hat es der Auftraggeber gesetzt. Jeder
# Eintrag gilt **bis** zu seiner Liga einschliesslich; ohne Treffer gilt
# ``limit_kmh``.
# Punkt 95: Die neue Liga 10 ist etwa so stark wie die alte Liga 10, die
# beiden untersten Stufen von 65 und 60 km/h haben damit keine Liga mehr.
limit_je_liga = [
    { bis_liga = 5, kmh = 80 },
    { bis_liga = 10, kmh = 70 },
]
# Wo die Strecke ohnehin langsamer als das Limit ist - in den unteren
# Ligen kommt das oft vor -, gilt nicht das Limit, sondern das
# Streckentempo **minus diesem Anteil**. Ohne den Abzug kostete die
# Boxengasse dort gar nichts, und ein Stopp waere in Liga 20 fast
# umsonst.
abzug_unter_limit = 0.05
# Spanne der Boxengassenlaenge. Ohne sie kam Monza mit der ganzen
# Start-Ziel-Geraden auf 1350 m und 44 s Durchfahrt - mehr als eine halbe
# Rundenzeit -, und Silverstone auf 45 m, weil Start/Ziel dort kurz vor
# dem Kurveneingang liegt. Echte Boxengassen liegen dazwischen.
min_laenge_m = 500
max_laenge_m = 750
# Die **Durchfahrt** darf hoechstens diesen Anteil der Rundenzeit kosten.
# Gemessen wird an der Referenzrundenzeit der Strecke, nicht am gerade
# fahrenden Auto - sonst haette jedes Auto seine eigene Boxengasse.
#
# Ueber die Zeit statt ueber die Laenge, weil die Laenge die Zeit nicht
# vorhersagt: Monza kostete bei 13 % Rundenlaenge 42 % Rundenzeit,
# Catalunya bei 16 % nur 38 %. Schnelle Strecken bestrafen die
# Boxengasse staerker.
#
# Die Standzeit steht bewusst **nicht** drin: Sie ist Sache der
# Mannschaft, die Boxengasse ist Sache der Strecke. Sonst wuerde die
# Gasse kuerzer, nur weil das Reifenwechseln laenger dauert.
#
# Bei 38 % war der Norisring mit 2260 m Runde die eine Ausnahme: Er kam
# auf 490 m und 47,8 % und musste ausdruecklich zugelassen werden. Mit
# 50 % faellt die Ausnahme weg - er landet bei 515 m und 49,6 %, alle
# uebrigen 19 Strecken bleiben unveraendert.
max_anteil_rundenzeit = 0.50
# Standzeit, gleichverteilt gewuerfelt. Sie meint das reine Stehen -
# Bremsen davor und Anfahren danach kommen aus der Fahrzeuggrenze und
# stehen nicht hier. Die Vorausberechnung rechnet mit der Mitte der
# Spanne, also mit 9 Sekunden: Sie kennt die einzelnen Wuerfe nicht, und
# die Mitte bevorzugt keine Strategie.
standzeit_min_s = 6.0
standzeit_max_s = 12.0

# Die Strategieregeln des Auftraggebers.
[boxenstopp.strategie]
# Mindestens einer, weil zwei verschiedene Mischungen Pflicht sind.
stopps_min = 1
stopps_max = 3
# Geht es rechnerisch mit drei Stopps nicht auf - auf sehr
# verschleissstarken Strecken oder mit einem sehr schonungslosen Auto -,
# darf ein vierter dazukommen. Das ist dann das Maximum.
stopps_max_notfall = 4
# In den ersten und letzten drei Runden wird nicht gestoppt.
sperre_runden = 3
# Zwei Grenzen fuer die weichste Trockenmischung (Entscheidung des
# Auftraggebers). Sie soll da verschwinden, wo sie ohnehin nicht traegt:
#
# 1. Wer mit mehr als so vielen Stopps plant, faehrt nicht auf Weich. Eine
#    Vier-Stopp-Strategie auf dem weichsten Gummi ist kein Plan, sondern
#    ein Eingestaendnis.
weich_hoechstens_stopps = 3
# 2. Und ab diesem Streckenfaktor (GDD 3) faellt Weich ganz weg - dort
#    bleiben nur Mittel und Hart. Von den zwanzig Strecken trifft das die
#    verschleissstaerksten.
weich_hoechstens_streckenfaktor = 1.15
# Das Boxenstoppfenster: Auf die berechnete optimale Stopprunde kommt ein
# zufaelliges Delta von +/- diesem Anteil der Renndistanz, aufgerundet,
# mindestens aber eine Runde - es bleiben also immer drei moegliche
# Runden (eine frueher, die geplante, eine spaeter). Wichtig ist die
# Reihenfolge: Erst wird die beste Kombination gerechnet, **dann** kommt
# das Delta drauf - nicht umgekehrt.
#
# Punkt 91: von 5 auf 3 Prozent und von zwei auf eine Mindestrunde
# (Entscheidung des Auftraggebers). Der Plan gilt jetzt dem Medianfahrer
# und wird nicht mehr je Auto nachgerechnet; ein schmaleres Fenster haelt
# die Abweichung vom geplanten Restprofil klein, entzerrt die Boxengasse
# aber weiterhin.
fenster_anteil = 0.03
fenster_min_runden = 1
# So viel Restprofil soll ein Stint planmaessig uebrig lassen - auch im
# Ziel. Nur wenn das Zufallsfenster den letzten Stopp nach vorn zieht,
# faellt es darunter. Damit fallen auf verschleissstarken Strecken die
# Ein-Stopp-Strategien von selbst heraus.
#
# Punkt 89: dieselbe Zahl wie notstopp_ab_restprofil, und zwar weiter
# absichtlich - der Planer laesst jeden Stint dort enden, wer darunter
# faellt, ist aus dem Plan gefallen. Mit 0,40 liegt die Untergrenze des
# Stoppfensters aus der Vorgabe (40 bis 55 Prozent) genau hier.
mindest_restprofil = 0.40
# Ein geplanter Stopp wird verschoben, solange der Satz noch besser als
# dieser Wert ist - Runde um Runde, bis er darunter faellt. Sonst gibt
# ein Auto nach einem Notstopp vier Runden spaeter einen fast neuen Satz
# ab, nur weil der Plan das so vorsah.
#
# Stand auf 0,75 und traf damit zu knapp daneben: Ein Satz, der sieben
# Runden nach einem Zwangsstopp bei 72 Prozent stand, rutschte darunter
# durch und wurde weggeworfen - auf Zandvoort 22 von 107 Stopps, 14 davon
# ohne jeden Mischungswechsel, also rund 25 Sekunden fuer nichts.
# Entscheidung des Auftraggebers: 0,65. Gemessen danach: Ein verworfener
# Satz hat noch 64 statt 72 Prozent, und ueber die fuenf Strecken fallen
# 4 von 47 dieser Stopps ganz weg. Die uebrigen bleiben - das Verschieben
# rueckt den Stopp nur nach hinten, es streicht ihn nicht.
# Punkt 89: Der Auftraggeber hat das Fenster neu gesetzt - ein Stopp
# soll bei 40 bis 55 Prozent Restprofil fallen. Verschoben wird also
# nur noch, solange der Satz ueber 55 Prozent hat (frueher 65).
planstopp_ab_restprofil = 0.55
# Und nach einem Zwangsstopp noch einmal zehn Punkte tiefer (Entscheidung
# des Auftraggebers). Der Satz ist dann eben erst aufgezogen worden; ihn
# beim naechsten Planstopp schon wieder abzugeben, kostet zweimal rund
# 25 Sekunden fuer denselben Reifenwechsel.
planstopp_nach_notstopp_restprofil = 0.50
# Wie weit eine Variante hinter der besten liegen darf, bevor sie
# ausscheidet: ein Sockel plus ein Anteil je 100 km Renndistanz. Liegen
# die Varianten dicht beieinander, bleiben alle drei Stoppzahlen
# moeglich; liegen sie weit auseinander, bleibt nur die beste.
#
# Punkt 92: beide Werte mal 1,2 (Entscheidung des Auftraggebers). Seit
# jede Mischungsreihenfolge einzeln gerechnet wird, ist die Liste
# laenger und feiner gestuft; zwanzig Prozent mehr Luft lassen mehr
# Stoppzahlen nebeneinander bestehen, ohne die Laengenabhaengigkeit
# aufzugeben. Bei 100 km sind das jetzt 36 s, bei 200 km 54 s, bei
# 300 km 72 s.
variantenschwelle_sockel_s = 18.0
variantenschwelle_je_100km_s = 18.0
# Zwangsstopp bei abgefahrenem Reifen (Entscheidung des Auftraggebers).
# Frueher zwang nur das Wetter herein. Ein Auto, dessen Satz lange vor
# der geplanten Stopprunde durch war, kam nie zu seinem Stopp: Es schlich
# auf blankem Gummi weiter, erreichte die geplante Runde nicht mehr und
# beendete das Rennen ohne den vorgeschriebenen Mischungswechsel.
# Gemessen ueber fuenf Strecken: drei bis vier Autos je Rennen, immer die
# schwaechsten des Feldes - sie kamen nach 11 bis 19 von 51 bis 69 Runden
# ins Ziel, weil sie auf blankem Gummi nur noch 16 km/h fuhren. Mit der
# Regel faehrt keines von ihnen mehr ohne Stopp.
#
# Faellt das Restprofil darunter, kommt das Auto in der naechsten Runde
# herein - aber nicht mehr in den letzten Runden, dafuer gilt dieselbe
# Sperre wie fuer jeden anderen Stopp (sperre_runden oben).
#
# Punkt 89: Der Notstopp bleibt bei 0,30, obwohl der Planer seine Stints
# bei 40 Prozent enden laesst (Entscheidung des Auftraggebers). Die zehn
# Punkte dazwischen sind **Luft fuer die Streuung**: Geplant wird auf
# Sollwerten, gefahren wird mit Delta - auf den Verschleiss und auf die
# Stopprunde. Faellt der Ausloeser mit dem Planerboden zusammen, wird
# jedes Auto, das etwas schlechter mit den Reifen umgeht, zum
# Zwangsstopp; gemessen stiegen sie damit von 38 auf 73 ueber die
# fuenf Strecken.
notstopp_ab_restprofil = 0.30
# Wetterwechsel: Hoechstens so viele Runden faehrt ein Auto auf dem
# falschen Reifen, bevor es hereinkommt. **Je Auto ausgewuerfelt** von
# null bis zu diesem Wert (Entscheidung des Auftraggebers).
#
# Der Wert stand auf 3 und wurde von nichts gelesen - notstopp() holte
# jedes Auto in der fruehestmoeglichen Runde herein. Dreht das Wetter,
# werden alle dreissig Reifen im selben Augenblick falsch, also kam das
# ganze Feld in derselben Runde: gemessen in Liga 20 auf Sakhir 17 Autos
# in Runde 10 und 12 in Runde 11. Dass ein Schauer ein Feld binnen
# weniger Runden hereinholt, ist richtig; dass es dieselbe Runde ist,
# war der tote Wert.
falscher_reifen_max_runden = 2
# Und so viele Runden muessen zwischen zwei Stopps liegen - sonst kaeme
# ein Auto bei schnellem Wetterwechsel zweimal hintereinander herein.
abstand_min_runden = 3
# Bei diesen Lagen entfaellt die Pflicht zu zwei Mischungen: Wer auf
# Intermediates oder Regenreifen wechselt, hat ohnehin gewechselt, und
# ein Rennen unter Wasser soll niemanden zwingen, einmal auf
# Trockenreifen herauszufahren. Das Wetter steht vor dem Rennen fest
# (GDD 7), also steht auch diese Regel vor dem Rennen fest.
ohne_pflicht_bei = ["regen", "starkregen", "wechselhaft"]
# Wie weit eine Mischung von der Naesse der Lage abweichen darf, damit
# die KI sie ueberhaupt in Betracht zieht. Bei 0,30 ergibt das:
#   trocken      -> weich, mittel, hart
#   wechselhaft  -> nur Intermediates (sie sind dort die schnellsten)
#   regen        -> Intermediates und Regenreifen
#   starkregen   -> nur Regenreifen
# Ohne die Grenze kamen gemessen Folgen wie Hart-Inter-Weich-Inter im
# Trockenen heraus - ein Intermediate kostet dort 6 % Tempo.
eignungsgrenze = 0.30

# Punkt 92: Mit welchem Gewicht eine Variante gezogen wird, nach ihrer
# **Stoppzahl**. Naturgemaess gibt es mehr Varianten mit mehr Stopps:
# Bei drei Trockenmischungen hat eine Ein-Stopp-Folge 3^2 = 9
# Reihenfolgen, eine Zwei-Stopp-Folge 27 und eine Drei-Stopp-Folge 81.
# Wer gleich verteilt zieht, laesst das Feld schon deshalb oefter
# dreimal stoppen - gemessen planten in Zandvoort 86 und am
# Nuerburgring 97 Prozent der Autos drei Stopps, ohne dass das jemand
# entschieden haette.
#
# Die Gewichte gleichen das aus (Entscheidung des Auftraggebers):
# Ein-Stopp-Varianten zehnmal, Zwei-Stopp-Varianten 2,75-mal so
# wahrscheinlich wie Drei-Stopp-Varianten. Gezogen wird weiterhin nur
# aus den Varianten, die die Vorausberechnung zugelassen hat - das
# Gewicht aendert die Auswahl nicht, nur ihre Haeufigkeit.
#
# Eine Stoppzahl, die hier nicht steht, gilt mit 1,0.
[boxenstopp.strategie.variantengewicht]
1 = 10.0
2 = 2.75
3 = 1.0

# ---------------------------------------------------------------------------
# Punkt 7 - Fahrer holen: Vertraege, Gehalt und Abloese
# ---------------------------------------------------------------------------
# Steht im GDD nirgends; alle Regeln hier kommen vom Auftraggeber:
# Transferfenster im Winter, Gehalt plus Abloese, Potentiale voll
# sichtbar, und ein Fahrer darf ablehnen.
[transfer]
# Vertragslaufzeiten. Sie haengen wie das Ruecktrittsalter an Seed und
# Fahrernummer und muessen deshalb nicht gespeichert werden. Mit 1 bis 4
# Saisons ist in jedem Winter rund ein Drittel des Feldes frei.
laufzeit_min = 1
laufzeit_max = 4

# Das Gehalt eines Fahrers haengt an dem, was er **verdienen** kann: ein
# Anteil der Siegpraemie der Liga, in die sein Koennen gehoert - und der
# Liga, in die sein Potential ihn noch bringen kann. Ein fester
# Grundbetrag taete es nicht, denn ein Sieg in Liga 20 bringt 4.000 EUR
# und einer in Liga 1 das Dreihundertfache.
#
# Bei 0,75 kostet ein Spitzenfahrer rund ein Fuenftel dessen, was eine
# gute Saison in seiner Liga einbringt.
anteil_der_siegpraemie = 0.75
gewicht_koennen = 2.0
gewicht_potential = 1.0
# Ein junger Fahrer verlangt weniger, auch wenn er viel kann - er hat
# noch nichts bewiesen. Voll wirksam mit 18, weg ab 28.
jugendrabatt = 0.45

# Abloese je verbleibender Vertragssaison, als Vielfaches des
# Jahresgehalts. Ein Fahrer mit drei Restjahren kostet damit das
# Dreifache eines Jahresgehalts obendrauf.
abloese_je_saison = 1.0

# Wie ein Fahrer ein Angebot abwaegt. Die drei Gewichte werden auf die
# jeweilige Spanne bezogen: Ligavorteil an der Zahl der Ligen, Autovorteil
# an der Skala, Geldvorteil am Marktwert.
#
# Das Geld wiegt am schwersten, und das muss es: Ein neuer Fahrer bringt
# ein leeres Auto mit, der Autovorteil ist beim Spieler also fast immer
# negativ. Wer einen Star holen will, muss ihn ueberzahlen.
gewicht_liga = 1.4
gewicht_auto = 0.8
gewicht_geld = 0.5
# Ab hier sagt er ja. Bei 0 wuerde jedes Angebot reichen, das nicht
# schlechter ist als sein Status quo.
schwelle = 0.05
# Je bekannter ein Fahrer, desto mehr will er (Punkt 5).
anspruch_bekanntheit = 0.8

# ---------------------------------------------------------------------------
# GDD 13 – Wertung, Auf- und Abstieg
# ---------------------------------------------------------------------------
[wertung]
# Punkt 95: Eine einzige Leiter ueber alle zehn Ligen statt einer Tabelle
# je Liga. Die Meisterschaft laeuft ueber alle 400 Fahrer; wer in welcher
# Liga faehrt, entscheidet nur, wie hoch seine Leitersprosse liegt.
#
#     punkte(liga, platz) = sieger_liga1 - (liga - 1) * versatz - abstand(platz)
#
# mit  abstand(1) = 0
#      abstand(2) = abstand_erster_zweiter
#      abstand(p) = abstand_erster_zweiter + abstand_zweiter_dritter
#                   + schritt * (p - 3)            fuer p >= 3
#      versatz    = abstand(ankerplatz)
#
# Der Versatz ist damit keine eigene Zahl, sondern eine Folge des
# Ankerplatzes: Der Sieger einer Liga bekommt genau so viel wie dieser
# Platz der Liga darueber. Mit den Werten unten sind das 82 Punkte je
# Liga, eine Liga ist 127 Punkte breit, und 12 Fahrer je Liga liegen im
# Punktebereich der Liga darueber.
sieger_liga1 = 1000
abstand_erster_zweiter = 10
abstand_zweiter_dritter = 6
schritt = 3
ankerplatz = 25
# Zusatzpunkte als Anteil der Siegerpunkte **derselben** Liga, immer
# aufgerundet und mindestens 1 Punkt. Die schnellste Rennrunde zaehlt auch
# ohne Zielankunft (GDD 13).
anteil_schnellste_runde = 0.01
anteil_qualifying = [0.015, 0.005, 0.0025]
# Gleichstand in der Weltmeisterschaft: erst die hoehere Liga, dann mehr
# Siege, dann mehr zweite Plaetze und so weiter.
gleichstand = "hoehere_liga_dann_platzierungen"

[auf_abstieg]
aufsteiger = 3
absteiger = 3
# Liga 1 ohne Aufstieg, die unterste ohne Abstieg
gilt_fuer = "fahrer"
# Punkt 95: Gewechselt wird nicht erst am Saisonende, sondern alle fuenf
# Rennen - bei 20 Rennen je Saison also viermal. Entschieden wird nach der
# Gesamttabelle seit Saisonbeginn.
alle_rennen = 5
grundlage = "gesamttabelle"

[schnellsimulation]
# Die uebrigen 19 Ligen nach jedem Rennwochenende des Spielers
aufloesung = "runde"
enthaelt = ["wetter", "fehler", "unfaelle", "defekte"]

[statistik]
inhalte = [
  "rundenrekorde_je_strecke_und_liga",
  "siege",
  "podien",
  "pole_positions",
  "schnellste_runden",
  "gesamtpunkte_je_liga_und_saison",
  "historie_aller_saisons_und_ligen",
]

# ---------------------------------------------------------------------------
# GDD 14 – Einzelereignisse
