# Daempft zusaetzlich die negative Seite der Tagesform (GDD 8 und 11)
daempft_tagesform_negativ = true

# ---------------------------------------------------------------------------
# GDD 8 – Bereiche der Wirkungsmatrix
# ---------------------------------------------------------------------------
[wirkungsmatrix]
bereiche = ["ek", "k", "g", "bplus", "bminus", "st", "du", "fe", "ve", "er", "q"]
gewicht_min = 0
gewicht_max = 3
# Innerhalb eines Bereichs werden die Gewichte normiert
normieren_je_bereich = true

[wirkungsmatrix.bezeichnung]
ek = "Enge Kurve"
k = "Kurve"
g = "Gerade"
bplus = "Beschleunigen"
bminus = "Bremsen"
st = "Start"
du = "Duell"
fe = "Fehler/Streuung"
ve = "Verschleiss/Defekte"
er = "Ermuedung"
q = "Qualifying"

# ---------------------------------------------------------------------------
# GDD 9 – Kosten
# ---------------------------------------------------------------------------
[kosten]
# K(S) = k0 * (1 + S / teiler) ^ exponent, je Kaufschritt von +10
teiler = 1000.0
exponent = 0.6
k0_geld = 50.0
k0_erfahrung = 5.0
# Wer Zeit einsetzt, gibt auch etwas Erfahrung dazu: Ein belegter Tag ist
# Arbeit am Auto und am Fahrer, und die kostet Koepfe. Die Zeit selbst
# bleibt bei einem Tag - sie skaliert nicht -, die Erfahrung waechst mit
# jedem Kauf ueber dieselbe Kurve wie Geld und Erfahrung. Faehigkeiten,
# die ohnehin schon Erfahrung kosten, zahlen nicht doppelt.
k0_erfahrung_zeit = 2.0
# Nur Einzelkauf, kein Mehrfachkauf
mehrfachkauf = false
startkapital_euro = 1000

# Kontrollwerte aus der Tabelle in GDD 9
[[kosten.kontrolle]]
bezeichnung = "Bester Liga 20"
s = 157
naechster_schritt_euro = 55
summe_ab_0_euro = 820

[[kosten.kontrolle]]
